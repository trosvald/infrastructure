---
# yamllint disable rule:braces
# yamllint disable rule:commas
name: monitoring-c0

services:
  gatus:
    image: docker.io/twinproduction/gatus:v5.36.0@sha256:8df964117ac6a78749ec8cd00039a499268156b874c3a110dc58de7e312c1ab5
    platform: linux/amd64
    container_name: gatus-c0
    user: "65534:65534"
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    sysctls: { net.ipv4.ip_unprivileged_port_start: "443" }
    security_opt: [no-new-privileges:true]
    volumes:
      - { type: bind, source: /var/lib/monosense-monitoring/secrets/gatus.yaml, target: /config/config.yaml, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: /var/lib/monosense-monitoring/tls, target: /run/tls, read_only: true, bind: { create_host_path: false } }
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"]
    networks:
      c0_services: { ipv4_address: 10.25.13.36 }
    # The pinned distroless image has no HTTP client; Gatus is verified through
    # its routed HTTPS endpoint instead of a container-local health command.
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    logging: &bounded_logs
      driver: json-file
      options: { max-size: 10m, max-file: "3" }


  vector:
    image: docker.io/timberio/vector:0.58.0-alpine@sha256:645f51687e293577f2134d2907444da139538710f3c334f091c6070e122ef2ee
    platform: linux/amd64
    container_name: vector-c0
    user: "65534:65534"
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      vector-prune: { condition: service_started }
    volumes:
      - { type: bind, source: /var/lib/monosense-monitoring/secrets/vector.yaml, target: /etc/vector/vector.yaml, read_only: true, bind: { create_host_path: false } }
      - vector-evidence:/var/lib/vector
      - { type: bind, source: /var/lib/monosense-monitoring/vector-tls, target: /run/vector-tls, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: /var/lib/monosense-monitoring/vector-client, target: /run/vector-client, read_only: true, bind: { create_host_path: false } }
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"]
    networks:
      c0_services: { ipv4_address: 10.25.13.37 }
    healthcheck:
      test: [CMD, vector, validate, /etc/vector/vector.yaml]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    logging: *bounded_logs

  vector-prune:
    image: docker.io/timberio/vector:0.58.0-alpine@sha256:645f51687e293577f2134d2907444da139538710f3c334f091c6070e122ef2ee
    platform: linux/amd64
    user: "0:0"
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    entrypoint: [/bin/sh, -ceu]
    command: ["install -d -o 0 -g 65534 -m 0770 /var/lib/vector/evidence; while :; do find /var/lib/vector/evidence -type f -mtime +13 -delete; sleep 21600; done"]
    volumes: [vector-evidence:/var/lib/vector]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777"]
    networks: { maintenance: null }
    cpus: 0.1
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 32
    logging: *bounded_logs

volumes:
  vector-evidence:

networks:
  c0_services: { external: true, name: c0_services }
  maintenance: { internal: true, name: monitoring-c0-maintenance }
