---
name: omada-controller-c0

services:
  volume-init:
    # yamllint disable-line rule:line-length
    image: docker.io/mbentley/omada-controller:6.2.14.11@sha256:157f0e730e6ce4211ab5df533af656495c9803791356ced7fcec28b3caca03ad
    platform: linux/amd64
    user: 0:0
    network_mode: none
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        chown 508:508
        /opt/tplink/EAPController/data
        /opt/tplink/EAPController/logs
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: volume
        source: omada-controller-data
        target: /opt/tplink/EAPController/data
        volume:
          nocopy: true
      - type: volume
        source: omada-controller-logs
        target: /opt/tplink/EAPController/logs
        volume:
          nocopy: true

  omada-controller:
    # yamllint disable-line rule:line-length
    image: docker.io/mbentley/omada-controller:6.2.14.11@sha256:157f0e730e6ce4211ab5df533af656495c9803791356ced7fcec28b3caca03ad
    platform: linux/amd64
    user: 508:508
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      ROOTLESS: "true"
      TZ: Asia/Jakarta
      MANAGE_HTTP_PORT: "8088"
      MANAGE_HTTPS_PORT: "8043"
      PORTAL_HTTP_PORT: "8088"
      PORTAL_HTTPS_PORT: "8843"
      PORT_ADOPT_V1: "29812"
      PORT_APP_DISCOVERY: "27001"
      PORT_UPGRADE_V1: "29813"
      PORT_MANAGER_V1: "29811"
      PORT_MANAGER_V2: "29814"
      PORT_DISCOVERY: "29810"
      PORT_TRANSFER_V2: "29815"
      PORT_RTTY: "29816"
      PORT_DEVICE_MONITOR: "29817"
      UPGRADE_HTTPS_PORT: "8043"
      WEB_CONFIG_OVERRIDE: "false"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /healthcheck.sh
      start_period: 5m
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 5g
    mem_swappiness: 0
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - type: volume
        source: omada-controller-data
        target: /opt/tplink/EAPController/data
        volume:
          nocopy: true
      - type: volume
        source: omada-controller-logs
        target: /opt/tplink/EAPController/logs
        volume:
          nocopy: true
    networks:
      c0_omada_mgmt:
        ipv4_address: 10.25.10.26

volumes:
  omada-controller-data:
    name: omada-controller-data
  omada-controller-logs:
    name: omada-controller-logs

networks:
  c0_omada_mgmt:
    external: true
    name: c0_omada_mgmt
