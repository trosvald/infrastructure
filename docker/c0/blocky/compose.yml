---
name: blocky-c0

services:
  blocky:
    # yamllint disable-line rule:line-length
    image: docker.io/spx01/blocky:v0.34.0@sha256:595136fb127f4c952b621113e668c09acdcf15ac054d96ee6d4c51a76c35f5fd
    platform: linux/amd64
    user: "100:100"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "53"
    mem_swappiness: 0
    restart: "no"
    stop_grace_period: 15s
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - type: bind
        source: ./config.yml
        target: /app/config.yml
        read_only: true
    networks:
      c0_services:
        ipv4_address: 10.25.13.35
    healthcheck:
      test: [CMD, /app/blocky, healthcheck]
      start_period: 1m
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  c0_services:
    external: true
    name: c0_services
