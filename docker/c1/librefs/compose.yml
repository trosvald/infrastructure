---
name: librefs-c1

services:
  librefs:
    # yamllint disable-line rule:line-length
    image: ghcr.io/librefs/librefs:release.2026-05-04t00-42-47z@sha256:707de0b1fa0ff7c83dd72ad4bcd8225302f06a4ce5278b7356700401e95004ab
    platform: linux/amd64
    container_name: librefs-c1
    command: ["server", "/data", "--address", ":443", "--console-address", ":9001", "--certs-dir", "/certs/current"]
    user: "1000:1000"
    restart: "no"
    environment:
      HOME: /tmp
      MINIO_ROOT_USER_FILE: /run/secrets/librefs_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/librefs_root_password
    configs:
      - source: librefs_root_user
        target: /run/secrets/librefs_root_user
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: librefs_root_password
        target: /run/secrets/librefs_root_password
        uid: "1000"
        gid: "1000"
        mode: 0400
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    volumes:
      - type: bind
        source: /srv/librefs/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/librefs/certs
        target: /certs
        read_only: true
        bind:
          create_host_path: false
    networks:
      c1_services:
        ipv4_address: 10.25.13.65
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -ceu
        - >-
          status="$$(printf '%s\r\n' 'GET /minio/health/ready HTTP/1.0'
          'Host: s3.monosense.io' '' |
          openssl s_client -connect 127.0.0.1:443 -servername s3.monosense.io
          -verify_hostname s3.monosense.io -CAfile /certs/current/public.crt -quiet
          2>/dev/null | { IFS= read -r line; printf '%s' "$$line"; })";
          [[ "$$status" == *" 200 "* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    cpus: 4.0
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

configs:
  librefs_root_user:
    content: ${LIBREFS_ROOT_USER:?required}
  librefs_root_password:
    content: ${LIBREFS_ROOT_PASSWORD:?required}

networks:
  c1_services:
    external: true
    name: c1_services
