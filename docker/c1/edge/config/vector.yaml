data_dir: /var/lib/vector
sources:
  haproxy:
    type: socket
    mode: udp
    address: 0.0.0.0:1514
  forgejo:
    type: file
    include:
      - /var/log/forgejo-stack/forgejo/*.log
      - /var/log/forgejo-stack/postgres/*.log
      - /var/log/forgejo-stack/backup/*.log
    read_from: beginning
transforms:
  sanitize:
    type: remap
    inputs: [haproxy, forgejo]
    drop_on_error: true
    source: |
      message = to_string(.message) ?? ""
      app = if exists(.file) { "forgejo" } else { "haproxy" }
      message = redact!(message, filters: [r'(?i)(authorization|cookie|password|token|secret)=?[^ ]*', r'https?://[^/@ ]+:[^/@ ]+@'])
      . = {
        "message": message,
        "app": app,
        "host": to_string(.host) ?? "c1",
        "source_type": to_string(.source_type) ?? "unknown"
      }
sinks:
  victoria_logs:
    type: http
    inputs: [sanitize]
    uri: https://vlogs-ingest.internal:8444/insert/jsonline?_stream_fields=host,source_type,app&_msg_field=message
    method: post
    encoding: { codec: json }
    framing: { method: newline_delimited }
    compression: gzip
    tls:
      verify_certificate: true
      verify_hostname: true
      ca_file: /run/vector-client/ca.pem
      crt_file: /run/vector-client/certificate.pem
      key_file: /run/vector-client/private-key.pem
    batch: { max_bytes: 1048576, timeout_secs: 2 }
    request: { timeout_secs: 10, retry_attempts: 5 }
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
