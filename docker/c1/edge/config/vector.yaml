secret:
  local:
    type: directory
    path: /run/secrets
sources:
  haproxy:
    type: socket
    mode: udp
    address: 0.0.0.0:1514
  forgejo:
    type: file
    include:
      - /var/log/forgejo-stack/forgejo/*.log
      - /var/log/forgejo-stack/postgres/*.log
      - /var/log/forgejo-stack/backup/*.log
    read_from: beginning
transforms:
  sanitize:
    type: remap
    inputs: [haproxy, forgejo]
    drop_on_error: true
    source: |
      del(.authorization)
      del(.cookie)
      del(.headers)
      del(.password)
      del(.token)
      del(.request_body)
      if exists(.message) {
        .message = redact!(string!(.message), filters: [r'(?i)(authorization|cookie|password|token|secret)=?[^ ]*', r'https?://[^/@ ]+:[^/@ ]+@'])
      }
sinks:
  c0:
    type: http
    inputs: [sanitize]
    uri: https://logs-ingest.monosense.io:8686/
    method: post
    encoding: { codec: json }
    framing: { method: newline_delimited }
    auth:
      strategy: bearer
      token: SECRET[local.vector_token]
    tls:
      verify_certificate: true
      verify_hostname: true
      ca_file: /etc/ssl/certs/ca-certificates.crt
    batch: { max_bytes: 1048576, timeout_secs: 2 }
    request: { timeout_secs: 5, retry_attempts: 3 }
