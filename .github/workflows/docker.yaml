name: Docker configuration validation

on:
  pull_request:
    paths:
      - docker/**
      - docs/OMADA.md
      - docs/c1/**
      - CHANGELOG.md
      - docs/BLOCKY.md
      - .sops.yaml
      - .justfile
      - .mise.toml
      - mise.lock
      - .gitignore
      - .github/workflows/docker.yaml
  push:
    branches: [main]
    paths:
      - docker/**
      - docs/c1/**
      - CHANGELOG.md
      - .sops.yaml
      - docs/OMADA.md
      - docs/BLOCKY.md
      - .justfile
      - .mise.toml
      - mise.lock
      - .gitignore
      - .github/workflows/docker.yaml

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.8.11
          install_args: >-
            aqua:astral-sh/uv
            aqua:casey/just
            aqua:docker/compose
            aqua:getsops/sops
            aqua:gitleaks/gitleaks
            aqua:jqlang/jq
            aqua:mikefarah/yq
            aqua:rhysd/actionlint
            pipx:yamllint
            python
          cache: true
      - name: Verify scanner canary and scan repository
        run: just scan-secrets
      - name: Validate workflow syntax
        run: actionlint
      - name: Activate locked Docker Compose
        run: |
          install -d -m 0755 "$HOME/.docker/cli-plugins"
          ln -sf "$(command -v docker-cli-plugin-docker-compose)" \
            "$HOME/.docker/cli-plugins/docker-compose"
          test "$(docker compose version --short)" = "5.5.0"
      - name: Validate c0 Doco-CD configuration
        run: just docker validate-c0
      - name: Validate c1 shell and configuration contracts
        run: just docker validate-c1
