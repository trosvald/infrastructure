name: Docker configuration validation

on:
  pull_request:
    paths:
      - docker/**
      - .doco-cd*.yml
      - .sops.yaml
      - .justfile
      - .mise.toml
      - mise.lock
      - .gitignore
      - .github/workflows/docker.yaml
  push:
    branches: [main]
    paths:
      - docker/**
      - .doco-cd*.yml
      - .sops.yaml
      - .justfile
      - .mise.toml
      - mise.lock
      - .gitignore
      - .github/workflows/docker.yaml

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.8.11
          install_args: >-
            aqua:astral-sh/uv
            aqua:casey/just
            aqua:getsops/sops
            aqua:gitleaks/gitleaks
            aqua:jqlang/jq
            pipx:yamllint
            python
          cache: true
      - name: Verify scanner canary and scan repository
        run: scripts/gitleaks-scan.sh
      - name: Verify Docker Compose prerequisite
        run: docker compose version
      - name: Validate c0 Doco-CD configuration
        run: just docker validate-c0
