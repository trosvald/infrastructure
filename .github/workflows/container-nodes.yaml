---
name: Container nodes offline validation

'on':
  pull_request:
    paths:
      - ansible/container-nodes/**
      - ansible/requirements.yml
      - ansible/mod.just
      - ansible/README.md
      - scripts/gitleaks-scan.sh
      - .mise.toml
      - mise.lock
      - .justfile
      - .gitignore
      - .gitleaks.toml
      - .github/workflows/container-nodes.yaml
  push:
    branches: [main]
    paths:
      - ansible/container-nodes/**
      - ansible/requirements.yml
      - ansible/mod.just
      - ansible/README.md
      - scripts/gitleaks-scan.sh
      - .mise.toml
      - mise.lock
      - .justfile
      - .gitignore
      - .gitleaks.toml
      - .github/workflows/container-nodes.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANSIBLE_NOCOLOR: '1'
      ANSIBLE_FORCE_COLOR: '0'
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3
        with:
          version: 2026.8.11
          cache: true
      - name: Verify scanner canary and scan repository
        run: just scan-secrets
      - name: Bootstrap pinned container-node dependencies
        run: just ansible container-nodes bootstrap
      - name: Run offline container-node fixtures
        run: just ansible container-nodes test
      - name: Lint container-node project
        run: just ansible container-nodes lint
