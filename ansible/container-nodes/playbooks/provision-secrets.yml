---
- name: Provision protected container-node runtime material
  hosts: container_nodes
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars_files:
    - ../adoption.yml
  vars:
    container_nodes_action: provision-secrets
    container_nodes_runtime_assets_secret_action: true
    container_nodes_runtime_assets_rotate: false
    container_nodes_runtime_assets_controller_token: >-
      {{ lookup(
           'ansible.builtin.file',
           lookup('ansible.builtin.env', 'CONTAINER_NODES_OPENBAO_TOKEN_FILE')
         ) }}
  tasks:
    - name: Re-audit identity-critical state
      ansible.builtin.include_role: {name: audit}
    - name: Require exact reviewed adoption digest
      ansible.builtin.include_tasks: ../tasks/require-adoption.yml
    - name: Provision scoped credentials transactionally
      block:
        - name: Invoke protected secret provisioning boundary
          ansible.builtin.include_role:
            name: runtime_assets
            tasks_from: provision-secrets.yml
      rescue:
        - name: Stop after protected compensation
          ansible.builtin.fail:
            msg: Secret provisioning failed; prior protected material remains authoritative
