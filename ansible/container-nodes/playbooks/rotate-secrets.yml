---
- name: Rotate protected container-node runtime material
  hosts: container_nodes
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars_files:
    - ../adoption.yml
  vars:
    container_nodes_action: rotate-secrets
    container_nodes_runtime_assets_secret_action: true
    container_nodes_runtime_assets_rotate: true
    container_nodes_runtime_assets_controller_token: >-
      {{ lookup(
           'ansible.builtin.file',
           lookup('ansible.builtin.env', 'CONTAINER_NODES_OPENBAO_TOKEN_FILE')
         ) }}
  tasks:
    - name: Re-audit identity-critical state
      ansible.builtin.include_role: {name: audit}
    - name: Require exact reviewed adoption digest
      ansible.builtin.include_tasks: ../tasks/require-adoption.yml
    - name: Rotate scoped credentials transactionally
      block:
        - name: Invoke protected secret rotation boundary
          ansible.builtin.include_role:
            name: runtime_assets
            tasks_from: rotate-secrets.yml
      rescue:
        - name: Stop after protected compensation
          ansible.builtin.fail:
            msg: Secret rotation failed; prior credentials and consumer state remain authoritative
