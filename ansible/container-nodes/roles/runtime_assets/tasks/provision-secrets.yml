---
- name: Validate explicit secret action boundary
  ansible.builtin.assert:
    that:
      - container_nodes_runtime_assets_secret_action | bool
      - container_nodes_runtime_assets_controller_token | length > 20
      - not ansible_check_mode
    fail_msg: provision-secrets requires explicit protected controller authentication
  no_log: true

- name: Execute protected secret provision transaction
  block:
    - name: Create protected controller authentication directory
      ansible.builtin.tempfile:
        state: directory
        prefix: container-nodes-openbao-
      delegate_to: localhost
      become: false
      register: runtime_auth_directory
      no_log: true
      diff: false

    - name: Protect controller authentication directory
      ansible.builtin.file:
        path: "{{ runtime_auth_directory.path }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      no_log: true
      diff: false

    - name: Stage controller authentication in protected ephemeral custody
      atomic_secret:
        path: "{{ runtime_auth_directory.path }}/openbao.token"
        content: "{{ container_nodes_runtime_assets_controller_token }}\n"
        owner: "{{ lookup('ansible.builtin.pipe', 'id -u') }}"
        group: "{{ lookup('ansible.builtin.pipe', 'id -g') }}"
        parent_owner: "{{ lookup('ansible.builtin.pipe', 'id -u') }}"
        parent_group: "{{ lookup('ansible.builtin.pipe', 'id -g') }}"
        mode: '0600'
        parent_mode: '0700'
      delegate_to: localhost
      become: false
      no_log: true
      diff: false


    - name: Validate exact existing OpenBao records
      ansible.builtin.uri:
        url: "{{ container_nodes_runtime_assets_openbao_url }}/v1/{{ item.value.path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ lookup('ansible.builtin.file', runtime_auth_directory.path + '/openbao.token') }}"
        return_content: true
        status_code: 200
      loop: "{{ container_nodes_runtime_assets_kv_contracts | dict2items }}"
      delegate_to: localhost
      become: false
      register: runtime_kv_responses
      no_log: true
      diff: false

    - name: Enforce exact KV schemas and committed versions
      ansible.builtin.assert:
        that:
          - item.json.data.metadata.version | int > 0
          - item.json.data.data | dict2items | map(attribute='key') | list | sort ==
              container_nodes_runtime_assets_kv_contracts[item.item.key]['keys'] | sort
          - item.json.data.data | dict2items | map(attribute='value') | select('string') |
              reject('equalto', '') | list | length ==
              container_nodes_runtime_assets_kv_contracts[item.item.key]['keys'] | length
      loop: "{{ runtime_kv_responses.results }}"
      no_log: true
      diff: false

    - name: Require shared Vector credential equality before commit
      ansible.builtin.assert:
        that:
          - (runtime_kv_responses.results |
              selectattr('item.key', 'equalto', 'c0_monitoring') |
              first).json.data.data.vector_ingest_token ==
            (runtime_kv_responses.results |
              selectattr('item.key', 'equalto', 'c1_edge') |
              first).json.data.data.vector_ingest_token
      no_log: true
      diff: false

    - name: Materialize exact host consumers
      ansible.builtin.include_tasks: "materialize-{{ inventory_hostname }}.yml"
      no_log: true
    - name: Issue and commit exact host token consumers
      ansible.builtin.include_tasks: rotate-token-consumer.yml
      loop: "{{ container_nodes_runtime_assets_token_consumers[inventory_hostname] }}"
      loop_control:
        loop_var: runtime_token_consumer
        label: "{{ runtime_token_consumer.name }}"
      no_log: true

    - name: Inspect Forgejo before one-time administrator transition
      ansible.builtin.command:
        argv: [docker, container, inspect, --format, "{{ '{{.State.Running}}' }}", forgejo-c1]
      register: runtime_forgejo_container
      changed_when: false
      failed_when: false
      when:
        - inventory_hostname == 'c1'
        - not (container_nodes_runtime_assets_rotate | bool)
      no_log: true
      diff: false


    - name: Complete one-time Forgejo administrator transition
      ansible.builtin.include_tasks: forgejo-admin.yml
      vars:
        container_nodes_runtime_assets_forgejo_url: http://172.30.15.3:3000
      when:
        - inventory_hostname == 'c1'
        - not (container_nodes_runtime_assets_rotate | bool)
        - runtime_forgejo_container.rc == 0
        - runtime_forgejo_container.stdout == 'true'
      no_log: true
  always:
    - name: Remove ephemeral controller authentication state
      ansible.builtin.file:
        path: "{{ runtime_auth_directory.path }}"
        state: absent
      when: runtime_auth_directory is defined and runtime_auth_directory.path is defined
      delegate_to: localhost
      become: false
      no_log: true
      diff: false
