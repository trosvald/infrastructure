---
- name: Validate explicit rotation boundary
  ansible.builtin.assert:
    that:
      - container_nodes_runtime_assets_secret_action | bool
      - container_nodes_runtime_assets_rotate | bool
      - not ansible_check_mode
    fail_msg: rotate-secrets requires its explicit protected action flags
  no_log: true

- name: Provision and rotate protected consumers transactionally
  ansible.builtin.include_tasks: provision-secrets.yml
  no_log: true

- name: Rematerialize stateless libreFS through Doco provider
  ansible.builtin.command:
    argv: [/usr/local/sbin/rematerialize-c1-librefs-credentials]
  when: inventory_hostname == 'c1'
  register: runtime_librefs_rotation
  changed_when: true
  no_log: true
  diff: false
