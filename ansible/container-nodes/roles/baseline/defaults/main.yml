---
container_node_baseline_hostname: "{{ inventory_hostname }}"
container_node_baseline_timezone: Asia/Jakarta
container_node_baseline_locale: en_US.UTF-8
container_node_baseline_resolvers: [10.25.13.35]
container_node_baseline_search_domains: [monosense.io]
container_node_baseline_bootstrap_resolver: 10.25.10.100
container_node_baseline_ntp_servers: []
container_node_baseline_fallback_ntp_servers:
  - 0.debian.pool.ntp.org
  - 1.debian.pool.ntp.org
  - 2.debian.pool.ntp.org
  - 3.debian.pool.ntp.org
container_node_baseline_debian_components:
  - main
  - non-free-firmware
container_node_baseline_packages:
  - ca-certificates
  - curl
  - ethtool
  - ifupdown
  - jq
  - locales
  - logrotate
  - nftables
  - openssh-server
  - python3
  - rsync
  - systemd-timesyncd
container_node_baseline_critical_package_pins:
  ifupdown: 0.8.44+deb13u1
  linux-image-amd64: 6.12.101-1
  nftables: 1.1.3-1
  python3-cryptography: 43.0.0-3+deb13u1
  openssh-server: 1:10.0p1-7+deb13u4
  systemd-timesyncd: 257.13-1~deb13u1
container_node_baseline_reviewed_upgrade_packages: {}
container_node_baseline_modules:
  - 8021q
  - nf_conntrack
  - overlay
container_node_baseline_sysctl:
  net.ipv4.ip_forward: '1'
  net.ipv6.conf.all.forwarding: '0'
  vm.swappiness: '10'
container_node_baseline_services:
  systemd-timesyncd.service: {enabled: true, state: started}
  ssh.service: {enabled: true, state: started}
container_node_baseline_journald:
  Storage: auto
  MaxRetentionSec: '0'
  MaxFileSec: 1month
container_node_baseline_logrotate_rotate: 4
container_node_baseline_limits: []
