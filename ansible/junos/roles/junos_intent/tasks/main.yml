---
- name: Require an approved operation and commit comment
  ansible.builtin.assert:
    that:
      - junos_intent_operation in ['check', 'diff', 'deploy']
      - junos_intent_operation != 'deploy' or junos_intent_commit_comment | length >= 12

- name: Reject uncommitted adoption authorization
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ role_path }}/../../../.."
      - diff
      - --quiet
      - HEAD
      - --
      - ansible/junos/adoption.yml
  changed_when: false
  delegate_to: localhost
  when: junos_intent_operation == 'deploy'

- name: Read the committed adoption authorization
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ role_path }}/../../../.."
      - show
      - HEAD:ansible/junos/adoption.yml
  register: junos_intent_committed_adoption
  changed_when: false
  delegate_to: localhost
  when: junos_intent_operation == 'deploy'

- name: Require the committed adoption authorization for deployment
  ansible.builtin.assert:
    that:
      - (junos_intent_committed_adoption.stdout | from_yaml).adopted | default(false) | bool
    fail_msg: >-
      Routine deployment is disabled until the committed adoption record is true and the
      working copy matches HEAD. Complete the reviewed parity adoption procedure first.
  when: junos_intent_operation == 'deploy'

- name: Refuse unsafe or overrideable build directory
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.build"
    follow: false
  register: junos_intent_build_stat
  delegate_to: localhost

- name: Enforce protected build directory
  ansible.builtin.assert:
    that:
      - not junos_intent_build_stat.stat.exists or
        (junos_intent_build_stat.stat.isdir and not junos_intent_build_stat.stat.islnk and
        junos_intent_build_stat.stat.uid | string == lookup('ansible.builtin.pipe', 'id -u') and
        junos_intent_build_stat.stat.mode == '0700')
    fail_msg: "Junos artifact directory must be an owner-controlled real 0700 directory."
  delegate_to: localhost

- name: Create protected build directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../.build"
    state: directory
    mode: "0700"
    follow: false
  when: not junos_intent_build_stat.stat.exists
  delegate_to: localhost

- name: Select a private fresh candidate artifact
  ansible.builtin.set_fact:
    junos_intent_fresh_candidate_path: "{{ junos_intent_candidate_path }}.fresh"

- name: Render and validate deterministic candidate
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../scripts/junos_intent.py"
      - --intent-dir
      - "{{ role_path }}/../../intent/srx1500"
      - --topology
      - "{{ lookup('ansible.builtin.env', 'JUNOS_TOPOLOGY_FILE') }}"
      - --output
      - "{{ junos_intent_fresh_candidate_path }}"
      - --check
  register: junos_intent_render_result
  changed_when: false
  no_log: true
  delegate_to: localhost

- name: Read and hash the fresh candidate immediately after rendering
  ansible.builtin.set_fact:
    junos_intent_fresh_candidate_text: "{{ lookup('ansible.builtin.file', junos_intent_fresh_candidate_path, rstrip=false) }}"
    junos_intent_fresh_candidate_lines: "{{ lookup('ansible.builtin.file', junos_intent_fresh_candidate_path).splitlines() }}"
  no_log: true

- name: Hash the fresh candidate artifact
  ansible.builtin.stat:
    path: "{{ junos_intent_fresh_candidate_path }}"
    checksum_algorithm: sha256
    follow: false
  register: junos_intent_fresh_candidate_stat
  delegate_to: localhost
  no_log: true

- name: Bind deployment to the freshly rendered candidate
  ansible.builtin.assert:
    that:
      - junos_intent_fresh_candidate_stat.stat.exists
      - junos_intent_fresh_candidate_stat.stat.isreg
      - not junos_intent_fresh_candidate_stat.stat.islnk
      - >-
        (junos_intent_render_result.stderr | regex_search('(?m)^sha256:' ~ junos_expected_digest ~ '$')) is not none
      - junos_intent_fresh_candidate_stat.stat.checksum == junos_expected_digest
      - junos_intent_fresh_candidate_text | hash('sha256') == junos_expected_digest
    fail_msg: "Fresh candidate digest differs from the approved deployment digest."
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Verify device identity before candidate modification
  juniper.device.junos_facts:
    gather_subset:
      - default
      - hardware
  register: junos_intent_device_facts
  no_log: true

- name: Enforce device identity and release
  ansible.builtin.assert:
    that:
      - junos_intent_device_facts.ansible_facts.ansible_net_model | upper == junos_expected_model
      - junos_intent_device_facts.ansible_facts.ansible_net_hostname == junos_expected_hostname
      - junos_intent_device_facts.ansible_facts.ansible_net_version is regex(junos_expected_release_pattern)
    fail_msg: Connected device identity or Junos release does not match the approved target.
- name: Read direct managed-pool reservations with bounded Junos commands
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../scripts/read_managed.py"
  register: junos_intent_direct_reservations
  changed_when: false
  delegate_to: localhost
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Reject direct DHCP reservation ownership conflicts
  ansible.builtin.assert:
    that:
      - (junos_intent_direct_reservations.stdout | from_json).direct_reservation_paths is defined
      - (junos_intent_direct_reservations.stdout | from_json).direct_reservation_paths == []
    fail_msg: >-
      Direct DHCP reservation stanzas overlap ANSIBLE_SRX1500 ownership; complete the reviewed
      parity cleanup before loading a deployment candidate.
  when: junos_intent_operation == 'deploy'
  no_log: true


- name: Require a digest-bound deployment request
  ansible.builtin.assert:
    that:
      - junos_expected_digest | default('') is match('^[0-9a-f]{64}$')
      - junos_intent_commit_comment == 'Ansible candidate ' ~ junos_expected_digest
    fail_msg: "Deployment requires the exact rendered candidate digest in its commit comment."
  when: junos_intent_operation == 'deploy'

- name: Bind the protected deployment state destination
  ansible.builtin.set_fact:
    junos_intent_deploy_state_file: "{{ lookup('ansible.builtin.env', 'JUNOS_DEPLOY_STATE_FILE') }}"
    junos_intent_runtime_dir: "{{ lookup('ansible.builtin.env', 'OPENBAO_RUNTIME_DIR') }}"
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Require the deployment state destination inside the protected runtime
  ansible.builtin.assert:
    that:
      - junos_intent_runtime_dir | length > 0
      - junos_intent_deploy_state_file == junos_intent_runtime_dir ~ '/junos/deploy-state'
      - junos_intent_deploy_state_file.startswith(junos_intent_runtime_dir ~ '/')
    fail_msg: "Deployment state must be written inside the protected OpenBao runtime."
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Read commit state before candidate modification
  juniper.device.junos_command:
    commands:
      - show system commit
  register: junos_intent_preflight_commit
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Isolate the newest preflight commit record
  ansible.builtin.set_fact:
    junos_intent_preflight_commit_record: >-
      {{ (junos_intent_preflight_commit.stdout[0] | default('')).splitlines()
         | select('match', '^[ ]*0[ ]+') | first | default('') }}
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Reject a preexisting pending confirmed commit
  ansible.builtin.assert:
    that:
      - junos_intent_preflight_commit.stdout is defined
      - junos_intent_preflight_commit.stdout | length == 1
      - junos_intent_preflight_commit_record | trim | length > 0
      - junos_intent_preflight_commit_record | lower is not search('commit confirmed|pending|rollback in')
    fail_msg: "A pending confirmed commit already exists; wait for rollback or confirm it through its originating reviewed transaction before deploying."
  when: junos_intent_operation == 'deploy'
  no_log: true
- name: Normalize the current and reviewed candidate before loading
  ansible.builtin.set_fact:
    junos_intent_current_configuration: "{{ junos_intent_direct_reservations.stdout | from_json }}"
    junos_intent_preload_reviewed_lines: >-
      {{ junos_intent_fresh_candidate_lines
         | select('match', '^set groups ANSIBLE_SRX1500 ')
         | reject('search', ' protocols bgp group CILIUM authentication-key ')
         | list | sort }}
    junos_intent_preload_running_lines: >-
      {{ (junos_intent_direct_reservations.stdout | from_json).group.splitlines()
         | select('match', '^set groups ANSIBLE_SRX1500 ')
         | reject('search', ' protocols bgp group CILIUM authentication-key ')
         | list | sort }}
    junos_intent_preload_reviewed_authentication_count: >-
      {{ junos_intent_fresh_candidate_lines
         | select('search', ' protocols bgp group CILIUM authentication-key ')
         | list | length }}
    junos_intent_preload_running_authentication_count: >-
      {{ (junos_intent_direct_reservations.stdout | from_json).group.splitlines()
         | select('search', ' protocols bgp group CILIUM authentication-key ')
         | list | length }}
    junos_intent_preload_reviewed_vector_ca_profile:
      - set security pki ca-profile VECTOR-SRX-ROOT ca-identity VECTOR-SRX-ROOT
    junos_intent_preload_running_vector_ca_profile: >-
      {{ (junos_intent_direct_reservations.stdout | from_json).direct_vector_ca_profile.splitlines()
         | map('trim') | reject('equalto', '') | list | sort }}
    junos_intent_preload_reviewed_ordered_lines: >-
      {{ junos_intent_fresh_candidate_lines
         | select('match', '^set groups ANSIBLE_SRX1500 (policy-options policy-statement|security policies from-zone) ')
         | list }}
    junos_intent_preload_running_ordered_lines: >-
      {{ (junos_intent_direct_reservations.stdout | from_json).group.splitlines()
         | select('match', '^set groups ANSIBLE_SRX1500 (policy-options policy-statement|security policies from-zone) ')
         | list }}
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Extract reviewed pre-load policy order
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../scripts/junos_intent.py"
      - --order-ids
    stdin: "{{ junos_intent_preload_reviewed_ordered_lines | to_json }}"
  register: junos_intent_preload_reviewed_order
  changed_when: false
  delegate_to: localhost
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Extract running pre-load policy order
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../scripts/junos_intent.py"
      - --order-ids
    stdin: "{{ junos_intent_preload_running_ordered_lines | to_json }}"
  register: junos_intent_preload_running_order
  changed_when: false
  delegate_to: localhost
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Evaluate secret-safe convergence checks before candidate loading
  ansible.builtin.set_fact:
    junos_intent_convergence_checks:
      managed_lines: "{{ junos_intent_preload_reviewed_lines == junos_intent_preload_running_lines }}"
      reviewed_authentication: "{{ junos_intent_preload_reviewed_authentication_count | int == 1 }}"
      running_authentication: "{{ junos_intent_preload_running_authentication_count | int == 1 }}"
      apply_group: >-
        {{ junos_intent_current_configuration.apply_groups.splitlines()
           | map('trim') | reject('equalto', '') | list
           == ['set apply-groups ANSIBLE_SRX1500'] }}
      vector_ca_profile: >-
        {{ junos_intent_preload_running_vector_ca_profile
           == junos_intent_preload_reviewed_vector_ca_profile }}
      policy_order: >-
        {{ (junos_intent_preload_reviewed_order.stdout | from_json)
           == (junos_intent_preload_running_order.stdout | from_json) }}
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Detect a fully converged candidate before loading secrets
  ansible.builtin.set_fact:
    junos_intent_candidate_converged: >-
      {{ junos_intent_convergence_checks.values() | reject('equalto', true) | list | length == 0 }}
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Report only failed pre-load convergence check names
  ansible.builtin.debug:
    msg: >-
      {{ junos_intent_convergence_checks | dict2items
         | rejectattr('value', 'equalto', true) | map(attribute='key') | list }}
  when:
    - junos_intent_operation == 'deploy'
    - not (junos_intent_candidate_converged | bool)


- name: Validate and review the candidate without activation
  when: >-
    junos_intent_operation != 'deploy'
    or not (junos_intent_candidate_converged | default(false) | bool)
  block:
    - name: Load candidate and run commit-check without activation
      juniper.device.junos_config:
        lines: "{{ junos_intent_fresh_candidate_lines }}"
        src_format: set
        update: merge
        check_commit: true
        confirm: 0
        comment: "{{ junos_intent_commit_comment }}"
      register: junos_intent_candidate_result
      diff: true
      no_log: true

    - name: Require candidate diff evidence when Junos reports a change
      ansible.builtin.assert:
        that:
          - not (junos_intent_candidate_result.changed | default(false) | bool) or
            (junos_intent_candidate_result.diff is defined and junos_intent_candidate_result.diff.prepared is defined and
            junos_intent_candidate_result.diff.prepared | string | trim | length > 0)
        fail_msg: "Junos reported a changed candidate without prepared diff evidence."
      when: junos_intent_operation == 'diff'
    - name: Normalize authentication changes to a value-free path
      ansible.builtin.set_fact:
        junos_intent_safe_prepared_diff: >-
          {{ junos_intent_candidate_result.diff.prepared | string
             | regex_replace('(?m)^.*authentication-key.*$',
                             'protocols/bgp/group/CILIUM/authentication-key') }}
      when: junos_intent_operation == 'diff' and junos_intent_candidate_result.changed | default(false) | bool
      no_log: true


    - name: Persist only the bounded candidate diff for review
      ansible.builtin.copy:
        content: >-
          {{ junos_intent_safe_prepared_diff
             if (junos_intent_candidate_result.changed | default(false) | bool)
             else 'No candidate difference reported\n' }}
        dest: "{{ junos_intent_diff_path }}"
        mode: "0600"
      delegate_to: localhost
      no_log: true
      when: junos_intent_operation == 'diff'
  always:
    - name: Discard the validated NETCONF candidate
      ansible.netcommon.netconf_rpc:
        rpc: discard-changes
      changed_when: false
      no_log: true

- name: Commit the validated candidate with a ten-minute rollback timer
  juniper.device.junos_config:
    lines: "{{ junos_intent_fresh_candidate_lines }}"
    src_format: set
    update: merge
    check_commit: false
    # juniper.device.junos_config expresses the confirmed rollback timer in minutes.
    confirm: 10
    comment: "{{ junos_intent_commit_comment }}"
  register: junos_intent_deployment_result
  check_mode: false
  when:
    - junos_intent_operation == 'deploy'
    - junos_intent_candidate_result.changed | default(false) | bool
  no_log: true

- name: Reset the NETCONF session after a confirmed commit
  ansible.builtin.include_tasks: reset_connection.yml
  when:
    - junos_intent_operation == 'deploy'
    - junos_intent_candidate_result.changed | default(false) | bool


- name: Verify post-commit operational state
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../scripts/read_operational.py"
      - postcommit
  register: junos_intent_postcheck_raw
  changed_when: false
  delegate_to: localhost
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Parse bounded post-commit operational evidence
  ansible.builtin.set_fact:
    junos_intent_postcheck_result: "{{ junos_intent_postcheck_raw.stdout | from_json }}"
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Read managed-group exclusions with a bounded NETCONF XPath
  ansible.netcommon.netconf_rpc:
    rpc: get-config
    xmlns: urn:ietf:params:xml:ns:netconf:base:1.0
    content: |
      <source><running/></source>
      <filter type="xpath" select="//*[local-name()='apply-groups-except' and normalize-space(.)='ANSIBLE_SRX1500']"/>
  register: junos_intent_apply_groups_exceptions
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Normalize the reviewed and running managed configuration
  ansible.builtin.set_fact:
    junos_intent_postcheck_commit_record: "{{ junos_intent_postcheck_result.stdout[0] | default('') }}"
    junos_intent_reviewed_group_lines: >-
      {{ junos_intent_fresh_candidate_lines
         | select('match', '^set groups ANSIBLE_SRX1500 ')
         | reject('search', ' protocols bgp group CILIUM authentication-key ')
         | list | sort }}
    junos_intent_reviewed_authentication_count: >-
      {{ junos_intent_fresh_candidate_lines
         | select('search', ' protocols bgp group CILIUM authentication-key ')
         | list | length }}
    junos_intent_reviewed_apply_lines: >-
      {{ junos_intent_fresh_candidate_lines
         | select('match', '^set apply-groups ANSIBLE_SRX1500$') | list | sort }}
    junos_intent_running_group_lines: >-
      {{ junos_intent_postcheck_result.stdout[1].splitlines() | map('trim')
         | reject('equalto', '')
         | reject('search', ' protocols bgp group CILIUM authentication-key ')
         | list | sort }}
    junos_intent_running_authentication_count: >-
      {{ junos_intent_postcheck_result.stdout[1].splitlines()
         | select('search', ' protocols bgp group CILIUM authentication-key ')
         | list | length }}
    junos_intent_running_apply_lines: >-
      {{ junos_intent_postcheck_result.stdout[2].splitlines() | map('trim')
         | reject('equalto', '') | list | sort }}
    junos_intent_reviewed_ordered_lines: >-
      {{ junos_intent_fresh_candidate_lines
         | select('match', '^set groups ANSIBLE_SRX1500 (policy-options policy-statement|security policies from-zone) ')
         | list }}
    junos_intent_running_ordered_lines: >-
      {{ junos_intent_postcheck_result.stdout[1].splitlines() | map('trim')
         | select('match', '^set groups ANSIBLE_SRX1500 (policy-options policy-statement|security policies from-zone) ')
         | list }}
  when: junos_intent_operation == 'deploy'
  no_log: true
- name: Extract reviewed postcheck policy order
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../scripts/junos_intent.py"
      - --order-ids
    stdin: "{{ junos_intent_reviewed_ordered_lines | to_json }}"
  register: junos_intent_reviewed_order
  changed_when: false
  delegate_to: localhost
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Extract running postcheck policy order
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../scripts/junos_intent.py"
      - --order-ids
    stdin: "{{ junos_intent_running_ordered_lines | to_json }}"
  register: junos_intent_running_order
  changed_when: false
  delegate_to: localhost
  when: junos_intent_operation == 'deploy'
  no_log: true


- name: Require the exact managed candidate and common operational evidence
  ansible.builtin.assert:
    that:
      - junos_intent_postcheck_result.stdout is defined
      - junos_intent_postcheck_result.stdout | length == 13
      - junos_intent_reviewed_group_lines | length > 0
      - junos_intent_reviewed_apply_lines == ['set apply-groups ANSIBLE_SRX1500']
      - junos_intent_running_group_lines == junos_intent_reviewed_group_lines
      - junos_intent_reviewed_authentication_count | int == 1
      - junos_intent_running_authentication_count | int == 1
      - junos_intent_running_apply_lines == junos_intent_reviewed_apply_lines
      - (junos_intent_running_order.stdout | from_json) == (junos_intent_reviewed_order.stdout | from_json)
      - junos_intent_postcheck_result.stdout[3] is search('(?m)^\\s*irb[.]2510\\s+up\\s+up(?:\\s|$)')
      - junos_intent_postcheck_result.stdout[3] is search('(?m)^\\s*irb[.]2512\\s+up\\s+up(?:\\s|$)')
      - junos_intent_postcheck_result.stdout[4] is search('(?m)^\\s*\\S+\\s+VLAN-MGMT\\s+2510\\b')
      - junos_intent_postcheck_result.stdout[5] is search('0[.]0[.]0[.]0/0')
      - junos_intent_postcheck_result.stdout[5] is search('[*>]')
      - junos_intent_postcheck_result.stdout[6] is search('0[.]0[.]0[.]0/0')
      - junos_intent_postcheck_result.stdout[6] is search('[*>]')
      - junos_intent_postcheck_result.stdout[7] is search('HOME-TO-XLSATU')
      - junos_intent_postcheck_result.stdout[7] is search('MGMT-TO-MYREP')
      - junos_intent_postcheck_result.stdout[7] is search('PROD-TO-MYREP')
      - >-
        junos_intent_postcheck_result.stdout[12].splitlines()
        | map('trim') | reject('equalto', '') | list
        == ['set security pki ca-profile VECTOR-SRX-ROOT ca-identity VECTOR-SRX-ROOT']
      - junos_intent_postcheck_result.stdout[7] is search('DEV-TO-MYREP')
      - >-
        (junos_intent_postcheck_result.stdout[9]
         | regex_findall('10[.]25[.]11[.](?:11|12|13|14|15)')
         | unique | sort)
        == ['10.25.11.11', '10.25.11.12', '10.25.11.13', '10.25.11.14', '10.25.11.15']
      - junos_intent_postcheck_result.stdout[10] is search('10[.]25[.]20[.]0/24')
      - junos_intent_postcheck_result.stdout[10] is search('Discard')
      - junos_intent_postcheck_result.stdout[10] is search('[*>]')
      - junos_intent_postcheck_result.stdout[11] is search('(?m)^ge-0/0/0[.]0\\s+up\\s+up')
      - junos_intent_apply_groups_exceptions.stdout is defined
      - junos_intent_apply_groups_exceptions.stdout is not search('apply-groups-except')
    fail_msg: "Managed configuration or operational evidence does not match the reviewed candidate."
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Require the newest pending commit record for a changed candidate
  ansible.builtin.assert:
    that:
      - junos_intent_postcheck_commit_record is search('(?i)commit confirmed|pending|rollback in')
      - >-
        junos_intent_postcheck_commit_record
        is search('(?m)^[ ]*Ansible candidate ' ~ junos_expected_digest ~ '[ ]*$')
    fail_msg: "Newest pending commit is not bound to the reviewed candidate."
  when:
    - junos_intent_operation == 'deploy'
    - junos_intent_candidate_result.changed | default(false) | bool
  no_log: true

- name: Require every reviewed security policy and action
  ansible.builtin.assert:
    that:
      - item in junos_intent_postcheck_result.stdout[8]
    fail_msg: "Required security policy evidence is missing or has the wrong action: {{ item }}"
  loop:
    - set security policies from-zone HOME to-zone WAN-XLSATU policy HOME-INTERNET then permit
    - set security policies from-zone MGMT to-zone WAN-MYREP policy MGMT-INTERNET then permit
    - set security policies from-zone PROD to-zone WAN-MYREP policy PROD-INTERNET then permit
    - set security policies from-zone DEV to-zone WAN-MYREP policy DEV-INTERNET then permit
    - set security policies from-zone MGMT to-zone PROD policy MGMT-ADMIN-PROD then permit
    - set security policies from-zone MGMT to-zone DEV policy MGMT-ADMIN-DEV then permit
    - set security policies from-zone MGMT to-zone HOME policy MGMT-ADMIN-HOME then permit
    - set security policies from-zone PROD to-zone MGMT policy PROD-INFRA-MGMT then permit
    - set security policies from-zone DEV to-zone MGMT policy DEV-INFRA-MGMT then permit
    - set security policies from-zone PROD to-zone DEV policy PROD-INFRA-DEV then permit
    - set security policies from-zone DEV to-zone PROD policy DEV-INFRA-PROD then permit
    - set security policies from-zone HOME to-zone MGMT policy HOME-TO-DNS then permit
    - set security policies from-zone HOME to-zone MGMT policy HOME-BLOCK-MGMT then deny
    - set security policies from-zone HOME to-zone PROD policy HOME-BLOCK-PROD then deny
    - set security policies from-zone HOME to-zone DEV policy HOME-BLOCK-DEV then deny
    - set security policies from-zone PROD to-zone HOME policy PROD-BLOCK-HOME then deny
    - set security policies from-zone DEV to-zone HOME policy DEV-BLOCK-HOME then deny
    - set security policies default-policy deny-all
  when: junos_intent_operation == 'deploy'
  no_log: true

- name: Publish the verified digest-bound deployment state
  ansible.builtin.copy:
    content: |
      {{ 'pending' if (junos_intent_candidate_result.changed | default(false) | bool)
         else 'converged' }} {{ junos_expected_digest }}
    dest: "{{ junos_intent_deploy_state_file }}"
    mode: "0600"
    follow: false
  delegate_to: localhost
  when: junos_intent_operation == 'deploy'
  no_log: true


- name: Report safe candidate identity
  ansible.builtin.debug:
    msg: >-
      Candidate validated ({{ junos_intent_render_result.stderr | trim }}); transient diff is at
      {{ junos_intent_diff_path }}
