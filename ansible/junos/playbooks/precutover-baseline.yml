---
- name: Capture bounded SRX pre-cutover operational baseline
  hosts: junos
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Read device identity before baseline capture
      juniper.device.junos_facts:
        gather_subset:
          - default
          - hardware
      register: baseline_facts
      no_log: true

    - name: Enforce approved device identity and release train
      ansible.builtin.assert:
        that:
          - baseline_facts.ansible_facts.ansible_net_model | upper == junos_expected_model
          - baseline_facts.ansible_facts.ansible_net_hostname == junos_expected_hostname
          - baseline_facts.ansible_facts.ansible_net_version is regex(junos_expected_release_pattern)
      no_log: true

    - name: Read fixed session, SPU, screen, and MYREP evidence
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/read_operational.py"
          - precutover-baseline
      register: baseline_raw
      changed_when: false
      failed_when: false
      delegate_to: localhost
      no_log: true

    - name: Report only the safe fixed-command failure identity
      ansible.builtin.assert:
        that:
          - baseline_raw.rc == 0
        fail_msg: "{{ baseline_raw.stderr }}"

    - name: Require complete bounded baseline evidence
      ansible.builtin.assert:
        that:
          - (baseline_raw.stdout | from_json).stdout | length == 4
          - (baseline_raw.stdout | from_json).stdout | select('string') | list | length == 4
          - (baseline_raw.stdout | from_json).stdout[0] | length > 0
          - (baseline_raw.stdout | from_json).stdout[1] | length > 0
          - (baseline_raw.stdout | from_json).stdout[2] | length > 0
          - (baseline_raw.stdout | from_json).stdout[3] is search('(?m)^ge-0/0/1[.]0\\s+up\\s+up')
        fail_msg: "The SRX did not return the complete pre-cutover baseline."
      no_log: true

    - name: Report bounded pre-cutover baseline
      ansible.builtin.debug:
        msg:
          captured_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          sessions: "{{ (baseline_raw.stdout | from_json).stdout[0].splitlines() }}"
          spu: "{{ (baseline_raw.stdout | from_json).stdout[1].splitlines() }}"
          wan_screen: "{{ (baseline_raw.stdout | from_json).stdout[2].splitlines() }}"
          myrep_interface: "{{ (baseline_raw.stdout | from_json).stdout[3].splitlines() }}"
