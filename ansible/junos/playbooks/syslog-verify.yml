---
- name: Verify fixed SRX TLS syslog operational evidence
  hosts: junos
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Read device identity before syslog verification
      juniper.device.junos_facts:
        gather_subset:
          - default
          - hardware
      register: syslog_verify_facts
      no_log: true

    - name: Enforce approved device identity and release train
      ansible.builtin.assert:
        that:
          - syslog_verify_facts.ansible_facts.ansible_net_model | upper == junos_expected_model
          - syslog_verify_facts.ansible_facts.ansible_net_hostname == junos_expected_hostname
          - syslog_verify_facts.ansible_facts.ansible_net_version is regex(junos_expected_release_pattern)
      no_log: true

    - name: Read fixed TLS syslog evidence
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/read_operational.py"
          - syslog-verify
      register: syslog_verify_raw
      changed_when: false
      failed_when: false
      delegate_to: localhost
      no_log: true

    - name: Report only the safe fixed-command failure identity
      ansible.builtin.assert:
        that:
          - syslog_verify_raw.rc == 0
        fail_msg: "{{ syslog_verify_raw.stderr }}"

    - name: Require exact TLS syslog and flow-stream configuration
      ansible.builtin.assert:
        that:
          - (syslog_verify_raw.stdout | from_json).stdout | length == 8
          - (syslog_verify_raw.stdout | from_json).stdout[0] is search('transport tls')
          - (syslog_verify_raw.stdout | from_json).stdout[0] is search('trusted-ca-group EDGE-SYSLOG-CA')
          - (syslog_verify_raw.stdout | from_json).stdout[1] is search('mode stream')
          - (syslog_verify_raw.stdout | from_json).stdout[1] is search('format sd-syslog')
          - (syslog_verify_raw.stdout | from_json).stdout[1] is search('source-address 10[.]25[.]13[.]1')
          - (syslog_verify_raw.stdout | from_json).stdout[1] is search('stream VECTOR host 10[.]25[.]13[.]37')
          - (syslog_verify_raw.stdout | from_json).stdout[1] is search('stream VECTOR host port 6514')
          - (syslog_verify_raw.stdout | from_json).stdout[1] is search('transport protocol tls')
          - (syslog_verify_raw.stdout | from_json).stdout[1] is search('tls-profile VECTOR-SRX-TLS')
        fail_msg: "The SRX TLS syslog or security flow stream configuration is incomplete."
      no_log: true

    - name: Require exact dedicated TLS trust
      ansible.builtin.assert:
        that:
          - (syslog_verify_raw.stdout | from_json).stdout[2] is search('VECTOR-SRX-ROOT')
          - (syslog_verify_raw.stdout | from_json).stdout[2] is search('(?i)tls12|TLSv1[.]2')
          - (syslog_verify_raw.stdout | from_json).stdout[3] is search('(?i)2579E1AA95A2E40ABD3713234390F7F2165C4231')
        fail_msg: "The SRX does not retain the exact dedicated Vector CA."
      no_log: true

    - name: Require active SRX flow stream
      ansible.builtin.assert:
        that:
          - (syslog_verify_raw.stdout | from_json).stdout[4] is search('VECTOR|10[.]25[.]13[.]37')
          - (syslog_verify_raw.stdout | from_json).stdout[5] is search('6514')
        fail_msg: "The SRX has no active TLS security-log stream to Vector."
      no_log: true

    - name: Require operational MGMT-to-EDGE session logging
      ansible.builtin.assert:
        that:
          - (syslog_verify_raw.stdout | from_json).stdout[6] is search('MGMT-EDGE')
          - (syslog_verify_raw.stdout | from_json).stdout[6] is search('(?i)session.*close|close.*session')
          - (syslog_verify_raw.stdout | from_json).stdout[7] is search('MGMT-EDGE\\s+[1-9][0-9]*')
        fail_msg: "The operational MGMT-to-EDGE policy does not report session-close logging."
      no_log: true
