---
- name: Explicitly confirm a verified pending Junos commit
  hosts: junos
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Require the exact verified deployment digest
      ansible.builtin.assert:
        that:
          - junos_expected_digest | default('') is match('^[0-9a-f]{64}$')
          - junos_commit_comment | default('') == 'Ansible candidate ' ~ junos_expected_digest
        fail_msg: "Confirmation requires the exact deployment comment and digest."

    - name: Read the exact reviewed candidate without following links
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.env', 'JUNOS_CANDIDATE_FILE') }}"
        checksum_algorithm: sha256
        follow: false
      register: confirm_candidate_stat
      delegate_to: localhost
      no_log: true

    - name: Read the exact reviewed candidate into memory
      ansible.builtin.set_fact:
        confirm_candidate_text: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'JUNOS_CANDIDATE_FILE'), rstrip=false) }}"
      no_log: true
    - name: Bind confirmation to the reviewed candidate artifact
      ansible.builtin.assert:
        that:
          - confirm_candidate_stat.stat.exists
          - confirm_candidate_stat.stat.isreg
          - not confirm_candidate_stat.stat.islnk
          - confirm_candidate_stat.stat.checksum == junos_expected_digest
          - confirm_candidate_text | hash('sha256') == junos_expected_digest
        fail_msg: "Reviewed candidate is absent, unsafe, or has a different digest."
      delegate_to: localhost
      no_log: true

    - name: Normalize the reviewed managed configuration
      ansible.builtin.set_fact:
        confirm_reviewed_group_lines: >-
          {{ confirm_candidate_text.splitlines() | map('trim')
             | select('match', '^set groups ANSIBLE_SRX1500 ')
             | reject('search', ' protocols bgp group CILIUM authentication-key ')
             | list | sort }}
        confirm_reviewed_authentication_count: >-
          {{ confirm_candidate_text.splitlines()
             | select('search', ' protocols bgp group CILIUM authentication-key ')
             | list | length }}
        confirm_reviewed_apply_lines: >-
          {{ confirm_candidate_text.splitlines() | map('trim')
             | select('match', '^set apply-groups ANSIBLE_SRX1500$') | list | sort }}
        confirm_reviewed_ordered_lines: >-
          {{ confirm_candidate_text.splitlines() | map('trim')
             | select('match', '^set groups ANSIBLE_SRX1500 (policy-options policy-statement|security policies from-zone) ')
             | list }}
      no_log: true

    - name: Read device identity before the final confirmation boundary
      juniper.device.junos_facts:
        gather_subset:
          - default
          - hardware
      register: confirm_device_facts
      no_log: true

    - name: Enforce approved device identity and release train
      ansible.builtin.assert:
        that:
          - confirm_device_facts.ansible_facts.ansible_net_model | upper == junos_expected_model
          - confirm_device_facts.ansible_facts.ansible_net_hostname == junos_expected_hostname
          - confirm_device_facts.ansible_facts.ansible_net_version is regex(junos_expected_release_pattern)

    - name: Re-read the newest commit and all required evidence immediately before confirmation
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/read_operational.py"
          - postcommit
      register: confirm_pending_raw
      changed_when: false
      delegate_to: localhost
      no_log: true

    - name: Parse bounded pre-confirmation operational evidence
      ansible.builtin.set_fact:
        confirm_pending: "{{ confirm_pending_raw.stdout | from_json }}"
      no_log: true

    - name: Read managed-group exclusions with a bounded NETCONF XPath
      ansible.netcommon.netconf_rpc:
        rpc: get-config
        xmlns: urn:ietf:params:xml:ns:netconf:base:1.0
        content: |
          <source><running/></source>
          <filter type="xpath" select="//*[local-name()='apply-groups-except' and normalize-space(.)='ANSIBLE_SRX1500']"/>
      register: confirm_apply_groups_exceptions
      no_log: true
    - name: Read direct managed-pool reservations with bounded Junos commands
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/read_managed.py"
      register: confirm_direct_reservations
      changed_when: false
      delegate_to: localhost
      no_log: true

    - name: Reject direct DHCP reservation ownership conflicts before confirmation
      ansible.builtin.assert:
        that:
          - (confirm_direct_reservations.stdout | from_json).direct_reservation_paths is defined
          - (confirm_direct_reservations.stdout | from_json).direct_reservation_paths == []
        fail_msg: >-
          Direct DHCP reservation stanzas overlap ANSIBLE_SRX1500 ownership; refusing confirmation.
      no_log: true

    - name: Isolate the newest commit record and normalize running configuration
      ansible.builtin.set_fact:
        confirm_newest_commit_record: "{{ confirm_pending.stdout[0] | default('') }}"
        confirm_running_group_lines: >-
          {{ confirm_pending.stdout[1].splitlines() | map('trim')
             | reject('equalto', '')
             | reject('search', ' protocols bgp group CILIUM authentication-key ')
             | list | sort }}
        confirm_running_authentication_count: >-
          {{ confirm_pending.stdout[1].splitlines()
             | select('search', ' protocols bgp group CILIUM authentication-key ')
             | list | length }}
        confirm_running_apply_lines: >-
          {{ confirm_pending.stdout[2].splitlines() | map('trim')
             | reject('equalto', '') | list | sort }}
        confirm_running_ordered_lines: >-
          {{ confirm_pending.stdout[1].splitlines() | map('trim')
             | select('match', '^set groups ANSIBLE_SRX1500 (policy-options policy-statement|security policies from-zone) ')
             | list }}
      no_log: true

    - name: Extract reviewed policy order by managed parent
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/junos_intent.py"
          - --order-ids
        stdin: "{{ confirm_reviewed_ordered_lines | to_json }}"
      register: confirm_reviewed_order
      changed_when: false
      delegate_to: localhost
      no_log: true

    - name: Extract running policy order by managed parent
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/junos_intent.py"
          - --order-ids
        stdin: "{{ confirm_running_ordered_lines | to_json }}"
      register: confirm_running_order
      changed_when: false
      delegate_to: localhost
      no_log: true

    - name: Evaluate confirmation invariants without exposing configuration
      ansible.builtin.set_fact:
        confirm_invariants:
          commit_output_shape: >-
            {{ confirm_pending.stdout is defined and confirm_pending.stdout | length == 13 }}
          newest_commit_present: "{{ confirm_newest_commit_record | length > 0 }}"
          pending_commit_marker: >-
            {{ confirm_newest_commit_record | lower is search('commit confirmed|pending|rollback in') }}
          candidate_digest_comment: >-
            {{ confirm_newest_commit_record
               is search('(?m)^[ ]*Ansible candidate ' ~ junos_expected_digest ~ '[ ]*$') }}
          reviewed_group_present: "{{ confirm_reviewed_group_lines | length > 0 }}"
          reviewed_apply_group: >-
            {{ confirm_reviewed_apply_lines == ['set apply-groups ANSIBLE_SRX1500'] }}
          managed_group_match: "{{ confirm_running_group_lines == confirm_reviewed_group_lines }}"
          reviewed_authentication_path: "{{ confirm_reviewed_authentication_count | int == 1 }}"
          running_authentication_path: "{{ confirm_running_authentication_count | int == 1 }}"
          apply_group_match: "{{ confirm_running_apply_lines == confirm_reviewed_apply_lines }}"
          ordered_configuration_match: >-
            {{ (confirm_running_order.stdout | from_json)
               == (confirm_reviewed_order.stdout | from_json) }}
          vector_ca_profile: >-
            {{ confirm_pending.stdout[12].splitlines()
               | map('trim') | reject('equalto', '') | list
               == [
                 'set security pki ca-profile VECTOR-SRX-ROOT ca-identity VECTOR-SRX-ROOT',
                 'set security pki ca-profile VECTOR-SRX-ROOT revocation-check disable'
               ] }}
      no_log: true

    - name: Require the same newest pending commit and exact managed candidate
      ansible.builtin.assert:
        that:
          - item.value | bool
        fail_msg: "Confirmation invariant failed: {{ item.key }}"
      loop: "{{ confirm_invariants | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Require concrete interface, VLAN, and route evidence
      ansible.builtin.assert:
        that:
          - confirm_pending.stdout[3] is string
          - confirm_pending.stdout[3] is search('(?m)^\\s*irb[.]2510\\s+up\\s+up(?:\\s|$)')
          - confirm_pending.stdout[3] is search('(?m)^\\s*irb[.]2512\\s+up\\s+up(?:\\s|$)')
          - confirm_pending.stdout[4] is string
          - confirm_pending.stdout[4] is search('(?m)^\\s*\\S+\\s+VLAN-MGMT\\s+2510\\b')
          - confirm_pending.stdout[5] is string
          - confirm_pending.stdout[5] is search('0[.]0[.]0[.]0/0')
          - confirm_pending.stdout[5] is search('[*>]')
          - confirm_pending.stdout[6] is string
          - confirm_pending.stdout[6] is search('0[.]0[.]0[.]0/0')
          - confirm_pending.stdout[6] is search('[*>]')
        fail_msg: "Required IRB, VLAN, or master/VR-XLSATU default-route evidence is missing."
      no_log: true
    - name: Re-require exact Cilium peers and static discard before confirmation
      ansible.builtin.assert:
        that:
          - >-
            (confirm_pending.stdout[9]
             | regex_findall('10[.]25[.]11[.](?:11|12|13|14|15)')
             | unique | sort)
            == ['10.25.11.11', '10.25.11.12', '10.25.11.13', '10.25.11.14', '10.25.11.15']
          - confirm_pending.stdout[10] is search('10[.]25[.]20[.]0/24')
          - confirm_pending.stdout[10] is search('Discard')
          - confirm_pending.stdout[10] is search('[*>]')
          - confirm_apply_groups_exceptions.stdout is defined
          - confirm_apply_groups_exceptions.stdout is not search('apply-groups-except')
        fail_msg: "Cilium peer configuration or static discard changed before confirmation."
      no_log: true


    - name: Require all four source NAT rule-set names
      ansible.builtin.assert:
        that:
          - item in confirm_pending.stdout[7]
        fail_msg: "Required source NAT rule-set evidence is missing: {{ item }}"
      loop:
        - HOME-TO-XLSATU
        - MGMT-TO-MYREP
        - PROD-TO-MYREP
        - DEV-TO-MYREP
      no_log: true

    - name: Require every critical security policy name and action
      ansible.builtin.assert:
        that:
          - item in confirm_pending.stdout[8]
        fail_msg: "Required security policy evidence is missing or has the wrong action: {{ item }}"
      loop:
        - set security policies from-zone HOME to-zone WAN-XLSATU policy HOME-INTERNET then permit
        - set security policies from-zone MGMT to-zone WAN-MYREP policy MGMT-INTERNET then permit
        - set security policies from-zone PROD to-zone WAN-MYREP policy PROD-INTERNET then permit
        - set security policies from-zone DEV to-zone WAN-MYREP policy DEV-INTERNET then permit
        - set security policies from-zone MGMT to-zone PROD policy MGMT-ADMIN-PROD then permit
        - set security policies from-zone MGMT to-zone DEV policy MGMT-ADMIN-DEV then permit
        - set security policies from-zone MGMT to-zone HOME policy MGMT-ADMIN-HOME then permit
        - set security policies from-zone PROD to-zone MGMT policy PROD-INFRA-MGMT then permit
        - set security policies from-zone DEV to-zone MGMT policy DEV-INFRA-MGMT then permit
        - set security policies from-zone PROD to-zone DEV policy PROD-INFRA-DEV then permit
        - set security policies from-zone DEV to-zone PROD policy DEV-INFRA-PROD then permit
        - set security policies from-zone HOME to-zone DEV policy HOME-TO-DNS then permit
        - set security policies from-zone HOME to-zone MGMT policy HOME-BLOCK-MGMT then deny
        - set security policies from-zone HOME to-zone PROD policy HOME-BLOCK-PROD then deny
        - set security policies from-zone HOME to-zone DEV policy HOME-BLOCK-DEV then deny
        - set security policies from-zone PROD to-zone HOME policy PROD-BLOCK-HOME then deny
        - set security policies from-zone DEV to-zone HOME policy DEV-BLOCK-HOME then deny
        - set security policies default-policy deny-all
      no_log: true

    - name: Confirm the already-verified pending commit through an exclusive session
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/confirm_commit.py"
      changed_when: true
      delegate_to: localhost
      no_log: true
