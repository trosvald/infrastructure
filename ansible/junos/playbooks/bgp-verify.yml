---
- name: Prove authenticated SRX Cilium BGP sessions and route boundaries
  hosts: junos
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    cilium_peers:
      - 10.25.11.11
      - 10.25.11.12
      - 10.25.11.13
      - 10.25.11.14
      - 10.25.11.15
  tasks:
    - name: Read device identity before BGP verification
      juniper.device.junos_facts:
        gather_subset:
          - default
          - hardware
      register: bgp_verify_facts
      no_log: true

    - name: Enforce approved device identity and release train
      ansible.builtin.assert:
        that:
          - bgp_verify_facts.ansible_facts.ansible_net_model | upper == junos_expected_model
          - bgp_verify_facts.ansible_facts.ansible_net_hostname == junos_expected_hostname
          - bgp_verify_facts.ansible_facts.ansible_net_version is regex(junos_expected_release_pattern)
      no_log: true

    - name: Read exact Cilium BGP session and route state
      juniper.device.junos_command:
        commands:
          - show configuration groups ANSIBLE_SRX1500 protocols bgp group CILIUM | display set
          - show bgp summary group CILIUM
          - show bgp neighbor 10.25.11.11
          - show bgp neighbor 10.25.11.12
          - show bgp neighbor 10.25.11.13
          - show bgp neighbor 10.25.11.14
          - show bgp neighbor 10.25.11.15
          - show route protocol bgp
          - show route receive-protocol bgp 10.25.11.11
          - show route receive-protocol bgp 10.25.11.12
          - show route receive-protocol bgp 10.25.11.13
          - show route receive-protocol bgp 10.25.11.14
          - show route receive-protocol bgp 10.25.11.15
          - show route advertising-protocol bgp 10.25.11.11
          - show route advertising-protocol bgp 10.25.11.12
          - show route advertising-protocol bgp 10.25.11.13
          - show route advertising-protocol bgp 10.25.11.14
          - show route advertising-protocol bgp 10.25.11.15
          - show route 10.25.20.0/24 exact
      register: bgp_verify
      no_log: true

    - name: Require the exact configured authenticated peer set
      ansible.builtin.assert:
        that:
          - bgp_verify.stdout | length == 19
          - >-
            (bgp_verify.stdout[0]
             | regex_findall('(?m)^set groups ANSIBLE_SRX1500 protocols bgp group CILIUM neighbor (10[.]25[.]11[.](?:11|12|13|14|15))$')
             | unique | sort) == cilium_peers
          - >-
            (bgp_verify.stdout[0]
             | regex_findall('(?m)^set groups ANSIBLE_SRX1500 protocols bgp group CILIUM authentication-key\s+.+$')
             | length) == 1
          - bgp_verify.stdout[0] is search('(?m)^set groups ANSIBLE_SRX1500 protocols bgp group CILIUM peer-as 64513$')
        fail_msg: "Configured CILIUM peers or value-free authentication path is not exact."
      no_log: true

    - name: Require all five authenticated sessions established to peer AS 64513
      ansible.builtin.assert:
        that:
          - item.1 is search('Peer:\s+' ~ item.0 ~ '([+\s]|$)')
          - item.1 is search('Peer AS:\s+64513\b')
          - item.1 is search('State:\s+Established\b')
      loop: "{{ cilium_peers | zip(bgp_verify.stdout[2:7]) }}"
      loop_control:
        label: "{{ item.0 }}"
      no_log: true

    - name: Reject every route outside approved LoadBalancer host advertisements
      ansible.builtin.assert:
        that:
          - >-
            bgp_verify.stdout[7]
            is not search('(?m)^\s*[*>+ -]*(?!10[.]25[.]20[.][0-9]+/32\s)[0-9]+(?:[.][0-9]+){3}/[0-9]+\s')
          - >-
            (bgp_verify.stdout[8:13] | join('\n'))
            is not search('(?m)^\s*[*>+ -]*(?!10[.]25[.]20[.][0-9]+/32\s)[0-9]+(?:[.][0-9]+){3}/[0-9]+\s')
          - >-
            (bgp_verify.stdout[13:18] | join('\n'))
            is not search('(?m)^\s*[*>+ -]*[0-9]+(?:[.][0-9]+){3}/[0-9]+\s')
          - bgp_verify.stdout[7] is not search('10[.]25[.]20[.]0/24')
        fail_msg: "BGP route import/export escaped the approved 10.25.20.0/24 /32-only boundary."
      no_log: true

    - name: Require the covering static discard beneath accepted host routes
      ansible.builtin.assert:
        that:
          - bgp_verify.stdout[18] is search('10[.]25[.]20[.]0/24')
          - bgp_verify.stdout[18] is search('Discard')
          - bgp_verify.stdout[18] is search('[*>]')
        fail_msg: "The active covering static discard route is missing."
      no_log: true
