---
- name: Safely operate the SRX1500 managed group
  hosts: junos
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    junos_intent_operation: "{{ operation | default('check') }}"
  tasks:
    - name: Apply structured Junos intent workflow
      ansible.builtin.include_role:
        name: junos_intent
