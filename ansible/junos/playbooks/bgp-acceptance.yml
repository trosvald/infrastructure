---
- name: Prove exact Cilium ECMP and discard acceptance phase
  hosts: junos
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    acceptance_contracts:
      all:
        sessions: 5
        service: [10.25.11.11, 10.25.11.12, 10.25.11.13, 10.25.11.14, 10.25.11.15]
        api: [10.25.11.11, 10.25.11.12, 10.25.11.13]
      worker-withdrawn:
        sessions: 4
        service: [10.25.11.11, 10.25.11.12, 10.25.11.13, 10.25.11.14]
        api: [10.25.11.11, 10.25.11.12, 10.25.11.13]
      controlplane-withdrawn:
        sessions: 4
        service: [10.25.11.11, 10.25.11.12, 10.25.11.14, 10.25.11.15]
        api: [10.25.11.11, 10.25.11.12]
      all-withdrawn:
        sessions: 0
        service: []
        api: []
      temporary-removed:
        sessions: 5
        service: []
        api: [10.25.11.11, 10.25.11.12, 10.25.11.13]
  tasks:
    - name: Read device identity before acceptance proof
      juniper.device.junos_facts:
        gather_subset:
          - default
          - hardware
      register: acceptance_facts
      no_log: true

    - name: Enforce approved device identity and release train
      ansible.builtin.assert:
        that:
          - acceptance_facts.ansible_facts.ansible_net_model | upper == junos_expected_model
          - acceptance_facts.ansible_facts.ansible_net_hostname == junos_expected_hostname
          - acceptance_facts.ansible_facts.ansible_net_version is regex(junos_expected_release_pattern)
      no_log: true

    - name: Require a fixed acceptance phase
      ansible.builtin.assert:
        that:
          - acceptance_phase | default('') in acceptance_contracts
        fail_msg: "BGP acceptance requires one fixed reviewed phase."

    - name: Read session, VIP route, forwarding, and fallback state
      juniper.device.junos_command:
        commands:
          - show bgp summary group CILIUM
          - show bgp neighbor 10.25.11.11
          - show bgp neighbor 10.25.11.12
          - show bgp neighbor 10.25.11.13
          - show bgp neighbor 10.25.11.14
          - show bgp neighbor 10.25.11.15
          - show route 10.25.20.11/32 exact
          - show route forwarding-table destination 10.25.20.11
          - show route 10.25.20.10/32 exact
          - show route forwarding-table destination 10.25.20.10
          - show route 10.25.20.0/24 exact
      register: acceptance_state
      no_log: true

    - name: Normalize exact established count and next-hop sets
      ansible.builtin.set_fact:
        acceptance_established: >-
          {{ (acceptance_state.stdout[1:6] | join('\n')
              | regex_findall('State:\s+Established\b')) | length }}
        acceptance_service_paths: >-
          {{ (acceptance_state.stdout[6:8] | join('\n')
              | regex_findall('10[.]25[.]11[.](?:11|12|13|14|15)')) | unique | sort }}
        acceptance_api_rib_paths: >-
          {{ (acceptance_state.stdout[8]
              | regex_findall('10[.]25[.]11[.](?:11|12|13|14|15)')) | unique | sort }}
        acceptance_api_fib_paths: >-
          {{ (acceptance_state.stdout[9]
              | regex_findall('10[.]25[.]11[.](?:11|12|13|14|15)')) | unique | sort }}
        acceptance_api_paths: >-
          {{ (acceptance_state.stdout[8:10] | join('\n')
              | regex_findall('10[.]25[.]11[.](?:11|12|13|14|15)')) | unique | sort }}
      no_log: true

    - name: Report bounded acceptance path evidence
      ansible.builtin.debug:
        msg:
          phase: "{{ acceptance_phase }}"
          sessions: "{{ acceptance_established }}"
          service: "{{ acceptance_service_paths }}"
          api: "{{ acceptance_api_paths }}"
          api_rib: "{{ acceptance_api_rib_paths }}"
          api_fib: "{{ acceptance_api_fib_paths }}"

    - name: Require exact phase sessions, ECMP paths, and static fallback
      ansible.builtin.assert:
        that:
          - acceptance_state.stdout | length == 11
          - acceptance_established | int == acceptance_contracts[acceptance_phase].sessions
          - acceptance_service_paths == acceptance_contracts[acceptance_phase].service
          - acceptance_api_paths == acceptance_contracts[acceptance_phase].api
          - acceptance_api_rib_paths == acceptance_contracts[acceptance_phase].api
          - acceptance_api_fib_paths == acceptance_contracts[acceptance_phase].api
          - acceptance_state.stdout[10] is search('10[.]25[.]20[.]0/24')
          - acceptance_state.stdout[10] is search('Discard')
          - acceptance_state.stdout[10] is search('[*>]')
          - >-
            acceptance_phase != 'all-withdrawn' or
            (acceptance_state.stdout[7] is search('(?i)(discard|dscd)') and
             acceptance_state.stdout[9] is search('(?i)(discard|dscd)'))
        fail_msg: "BGP sessions, ECMP next hops, or discard fallback differ from the phase contract."
      no_log: true
