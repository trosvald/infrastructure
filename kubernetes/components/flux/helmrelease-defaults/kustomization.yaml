---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
    patch: |-
      - op: add
        path: /spec/patches
        value:
          - target:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            patch: |-
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: _
              spec:
                interval: 30m
                driftDetection:
                  mode: enabled
                install:
                  crds: CreateReplace
                  strategy:
                    name: RetryOnFailure
                upgrade:
                  crds: CreateReplace
                  strategy:
                    name: RetryOnFailure
