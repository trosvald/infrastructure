---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  conditions:
    - namespaces:
        - flux-system
        - kube-system
        - networking
        - rook-ceph
        - kopiur-system
        - observability
        - database
        - security
        - ai
        - system-upgrade
  provider:
    vault:
      server: https://vault.monosense.io:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: openbao
            namespace: external-secrets
            audiences:
              - openbao-external-secrets
              - https://k8s.monosense.io:6443
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-envoy-edge
  namespace: networking
spec:
  vault:
    server: https://vault.monosense.io:8200
    path: pki-kubernetes/sign/envoy-edge
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-networking
        serviceAccountRef:
          name: openbao-issuer
          audiences:
            - openbao-cert-manager-networking
            - https://k8s.monosense.io:6443
---
