---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: envoy-edge-backend, namespace: networking }
spec:
  secretName: envoy-edge-backend-tls
  issuerRef: { kind: Issuer, name: openbao-envoy-edge }
  dnsNames: [envoy-edge.networking.svc.cluster.local]
  usages: [server auth]
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: envoy-internal, namespace: networking }
spec:
  secretName: envoy-internal-tls
  issuerRef: { kind: Issuer, name: openbao-envoy-internal }
  dnsNames: ["*.monosense.io"]
  usages: [server auth]
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
