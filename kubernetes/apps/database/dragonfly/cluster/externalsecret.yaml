---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-acl
spec:
  refreshInterval: 15m
  refreshPolicy: Periodic
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: dragonfly-acl
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        acl.conf: |
          user default off
          user forgejo-a on >{{ .forgejo_a }} ~forgejo:* &forgejo:* +@read +@write +@connection +@pubsub -flushall -flushdb -config -acl -shutdown
          user forgejo-b on >{{ .forgejo_b }} ~forgejo:* &forgejo:* +@read +@write +@connection +@pubsub -flushall -flushdb -config -acl -shutdown
          user keycloak-a on >{{ .keycloak_a }} ~keycloak:* &keycloak:* +@read +@write +@connection +@pubsub -flushall -flushdb -config -acl -shutdown
          user keycloak-b on >{{ .keycloak_b }} ~keycloak:* &keycloak:* +@read +@write +@connection +@pubsub -flushall -flushdb -config -acl -shutdown
          user litellm-a on >{{ .litellm_a }} ~litellm:* &litellm:* +@read +@write +@connection -flushall -flushdb -config -acl -shutdown
          user litellm-b on >{{ .litellm_b }} ~litellm:* &litellm:* +@read +@write +@connection -flushall -flushdb -config -acl -shutdown
  data:
    - secretKey: forgejo_a
      remoteRef: { key: platform/kubernetes/database/dragonfly, property: forgejo_a_password }
    - secretKey: forgejo_b
      remoteRef: { key: platform/kubernetes/database/dragonfly, property: forgejo_b_password }
    - secretKey: keycloak_a
      remoteRef: { key: platform/kubernetes/database/dragonfly, property: keycloak_a_password }
    - secretKey: keycloak_b
      remoteRef: { key: platform/kubernetes/database/dragonfly, property: keycloak_b_password }
    - secretKey: litellm_a
      remoteRef: { key: platform/kubernetes/database/dragonfly, property: litellm_a_password }
    - secretKey: litellm_b
      remoteRef: { key: platform/kubernetes/database/dragonfly, property: litellm_b_password }
