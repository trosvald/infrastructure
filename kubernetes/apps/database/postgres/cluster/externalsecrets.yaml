      remoteRef: { key: platform/kubernetes/database/cloudnative-pg, property: r2_access_key_id }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: platform/kubernetes/database/cloudnative-pg, property: r2_secret_access_key }
    - secretKey: R2_ENDPOINT
      remoteRef: { key: platform/kubernetes/database/cloudnative-pg, property: r2_endpoint }
    - secretKey: R2_BUCKET
      remoteRef: { key: platform/kubernetes/database/cloudnative-pg, property: r2_bucket }
