---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-keycloak-a
spec:
  refreshInterval: 15m
  refreshPolicy: Periodic
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: postgres-keycloak-a
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data: { username: keycloak_a, password: "{{ .password }}" }
  data:
    - secretKey: password
      remoteRef: { key: platform/kubernetes/database/cloudnative-pg, property: keycloak_a_password }
