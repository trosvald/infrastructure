---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup-mirror
  automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-mirror
spec:
  schedule: "30 19 * * *"
  timeZone: Asia/Jakarta
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup-mirror
        spec:
          serviceAccountName: postgres-backup-mirror
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: mirror
              image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
              command: [/bin/sh, -ec]
              args:
                - |
                  mc alias set --api S3v4 local https://s3.monosense.io:443 "$LOCAL_ACCESS_KEY_ID" "$LOCAL_SECRET_ACCESS_KEY"
                  mc alias set --api S3v4 r2 "$R2_ENDPOINT" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY"
                  mc mirror --preserve --retry local/kubernetes-postgres/primary "r2/$R2_BUCKET/postgres"
                  mc diff local/kubernetes-postgres/primary "r2/$R2_BUCKET/postgres"
              env:
                - name: LOCAL_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: postgres-backup, key: ACCESS_KEY_ID } }
                - name: LOCAL_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: postgres-backup, key: ACCESS_SECRET_KEY } }
                - name: R2_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: postgres-r2-mirror, key: ACCESS_KEY_ID } }
                - name: R2_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: postgres-r2-mirror, key: ACCESS_SECRET_KEY } }
                - name: R2_ENDPOINT
                  valueFrom: { secretKeyRef: { name: postgres-r2-mirror, key: R2_ENDPOINT } }
                - name: R2_BUCKET
                  valueFrom: { secretKeyRef: { name: postgres-r2-mirror, key: R2_BUCKET } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-backup-mirror
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-backup-mirror
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: TCP }
            - { port: "53", protocol: UDP }
    - toCIDR: [10.25.13.65/32]
      toPorts:
        - ports:
            - { port: "9000", protocol: TCP }
    - toFQDNs:
        - matchPattern: "*.r2.cloudflarestorage.com"
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
