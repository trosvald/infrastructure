---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-default-deny
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes: [Ingress, Egress]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: security
            k8s:io.kubernetes.serviceaccount.name: keycloak
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:io.kubernetes.serviceaccount.name: litellm
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            k8s:cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            k8s:io.kubernetes.serviceaccount.name: cloudnative-pg
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            k8s:cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: TCP }
            - { port: "53", protocol: UDP }
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "6443", protocol: TCP }
    - toCIDR: [10.25.13.65/32]
      toPorts:
        - ports:
            - { port: "9000", protocol: TCP }
