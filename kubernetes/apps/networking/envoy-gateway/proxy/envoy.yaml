---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-edge
spec:
  logging:
    level: { default: info }
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          image: mirror.gcr.io/envoyproxy/envoy:v1.39.0
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
        pod:
          labels: { gateway.monosense.io/role: edge }
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels: { gateway.monosense.io/role: edge }
      envoyPDB: { minAvailable: 1 }
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        allocateLoadBalancerNodePorts: false
        loadBalancerSourceRanges: [10.25.15.10/32]
      envoyServiceAccount: { name: envoy-edge }
  shutdown: { drainTimeout: 180s }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-internal
spec:
  logging:
    level: { default: info }
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          image: mirror.gcr.io/envoyproxy/envoy:v1.39.0
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
        pod:
          labels: { gateway.monosense.io/role: internal }
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels: { gateway.monosense.io/role: internal }
      envoyPDB: { minAvailable: 1 }
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        allocateLoadBalancerNodePorts: false
        loadBalancerSourceRanges:
          - 10.25.10.0/24
          - 10.25.11.0/24
          - 10.25.12.0/24
          - 10.25.13.0/24
      envoyServiceAccount: { name: envoy-internal }
  shutdown: { drainTimeout: 180s }
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-edge
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-edge
    namespace: networking
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-internal
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-internal
    namespace: networking
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-edge
  labels: { gateway.monosense.io/role: edge }
spec:
  gatewayClassName: envoy-edge
  infrastructure:
    labels:
      bgp.monosense.io/advertise: "true"
      lbipam.monosense.io/class: edge-backend
    annotations: { lbipam.cilium.io/ips: 10.25.20.80 }
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces: { from: Same }
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: envoy-edge-backend-tls }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  labels: { gateway.monosense.io/role: internal }
spec:
  gatewayClassName: envoy-internal
  infrastructure:
    labels:
      bgp.monosense.io/advertise: "true"
      lbipam.monosense.io/class: internal
    annotations: { lbipam.cilium.io/ips: 10.25.20.40 }
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { gateway.monosense.io/allow-internal-routes: "true" }
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: envoy-internal-tls }
    - name: vlogs-ingest
      protocol: HTTPS
      port: 8444
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { gateway.monosense.io/allow-internal-routes: "true" }
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: envoy-internal-tls }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy-edge-defaults
spec:
  targetRef: { group: gateway.networking.k8s.io, kind: Gateway, name: envoy-edge }
  timeout:
    http:
      connectionIdleTimeout: 60s
      requestTimeout: 30s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy-internal-defaults
spec:
  targetRef: { group: gateway.networking.k8s.io, kind: Gateway, name: envoy-internal }
  timeout:
    http:
      connectionIdleTimeout: 60s
      requestTimeout: 30s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-edge
spec:
  clientIPDetection:
    xForwardedFor: { numTrustedHops: 1 }
  http2: { onInvalidMessage: TerminateStream }
  targetRef: { group: gateway.networking.k8s.io, kind: Gateway, name: envoy-edge }
  timeout:
    http: { idleTimeout: 60s }
  tls:
    minVersion: "1.2"
    alpnProtocols: [h2, http/1.1]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-internal
spec:
  http2: { onInvalidMessage: TerminateStream }
  targetRef: { group: gateway.networking.k8s.io, kind: Gateway, name: envoy-internal }
  timeout:
    http: { idleTimeout: 60s }
  tls:
    minVersion: "1.2"
    alpnProtocols: [h2, http/1.1]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-internal-vlogs-ingest
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
    sectionName: vlogs-ingest
  tls:
    minVersion: "1.2"
    alpnProtocols: [h2, http/1.1]
    clientValidation:
      caCertificateRefs:
        - { group: "", kind: Secret, name: vector-client-ca }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vector-client-ca
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: vector-client-ca
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        ca.crt: "{{ .certificate }}"
  dataFrom:
    - extract: { key: platform/tls/kubernetes-ca }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-edge-ingress
spec:
  podSelector:
    matchLabels: { gateway.monosense.io/role: edge }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.25.15.10/32 }
      ports:
        - { protocol: TCP, port: 10443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-internal-ingress
spec:
  podSelector:
    matchLabels: { gateway.monosense.io/role: internal }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.25.10.0/24 }
        - ipBlock: { cidr: 10.25.11.0/24 }
        - ipBlock: { cidr: 10.25.12.0/24 }
        - ipBlock: { cidr: 10.25.13.0/24 }
      ports:
        - { protocol: TCP, port: 10443 }
        - { protocol: TCP, port: 18444 }
