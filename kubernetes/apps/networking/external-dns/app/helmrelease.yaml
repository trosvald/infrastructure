---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  chartRef:
    kind: OCIRepository
    name: external-dns
    namespace: flux-system
  interval: 1h
  values:
    fullnameOverride: external-dns-internal
    provider: { name: rfc2136 }
    sources: [gateway-httproute]
    triggerLoopOnEvent: true
    gatewayNamespace: networking
    domainFilters: [monosense.io]
    managedRecordTypes: [A, CNAME, TXT]
    policy: sync
    registry: txt
    txtOwnerId: external-dns-internal
    serviceAccount:
      name: external-dns-internal
    env:
      - name: TSIG_SECRET
        valueFrom:
          secretKeyRef: { name: external-dns-tsig, key: tsig-secret }
    extraArgs:
      - --gateway-name=envoy-internal
      - --rfc2136-host=10.25.13.33
      - --rfc2136-port=53
      - --rfc2136-zone=monosense.io
      - --rfc2136-create-ptr=false
      - --rfc2136-insecure=false
      - --rfc2136-tsig-keyname=external-dns-internal.
      - --rfc2136-tsig-secret=$(TSIG_SECRET)
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-axfr=false
    deploymentStrategy: { type: RollingUpdate }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: { app.kubernetes.io/name: external-dns }
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 250m, memory: 256Mi }
    serviceMonitor: { enabled: false }
