---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: codex-oauth }
spec:
  refreshInterval: 15m
  refreshPolicy: Periodic
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: codex-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        auth.json: '{{ .auth_json }}'
  data:
    - { secretKey: auth_json, remoteRef: { key: platform/kubernetes/ai/codex-adapter, property: auth_json } }
