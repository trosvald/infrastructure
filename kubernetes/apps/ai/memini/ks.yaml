---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: memini, namespace: ai }
spec:
  dependsOn:
    - { name: llmkube, namespace: ai }
    - { name: litellm, namespace: ai }
    - { name: kopiur-repository, namespace: kopiur-system }
    - { name: openbao-config, namespace: external-secrets }
  interval: 1h
  path: ./kubernetes/apps/ai/memini/app
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system, namespace: flux-system }
  targetNamespace: ai
  wait: true
