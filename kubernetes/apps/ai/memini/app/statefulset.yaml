---
apiVersion: v1
kind: ServiceAccount
metadata: { name: memini }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: memini }
spec:
  serviceName: memini
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: memini } }
  template:
    metadata: { labels: { app.kubernetes.io/name: memini } }
    spec:
      serviceAccountName: memini
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: memini
          image: ghcr.io/eleboucher/memini:0.7.18@sha256:a8c5ef541beddbbaff615ab71494b3b79ae7798378358767e7decd9dcd0a836f
          imagePullPolicy: IfNotPresent
          env:
            - { name: MEMINI_HTTP_ADDR, value: ":8080" }
            - { name: MEMINI_UI_ADDR, value: ":8081" }
            - { name: MEMINI_METRICS_ADDR, value: ":9090" }
            - { name: MEMINI_SQLITE_PATH, value: /data/memini.db }
            - { name: MEMINI_API_KEYS_FILE, value: /etc/memini/api-keys.yaml }
            - { name: MEMINI_EMBED_BASE_URL, value: https://qwen3-embedding-tls.ai.svc.cluster.local:8443/v1 }
            - { name: MEMINI_EMBED_MODEL, value: qwen3-embedding }
            - { name: MEMINI_EMBED_DIMS, value: "2560" }
            - { name: MEMINI_RECALL_EMBED_TIMEOUT, value: 2s }
            - { name: MEMINI_WRITE_EMBED_TIMEOUT, value: 2s }
            - { name: MEMINI_BACKGROUND_EMBED_TIMEOUT, value: 30s }
            - { name: MEMINI_BACKFILL_INTERVAL, value: 1m }
            - { name: MEMINI_LLM_BASE_URL, value: http://litellm.ai.svc.cluster.local:4000/v1 }
            - { name: MEMINI_LLM_MODEL, value: memini-chat }
            - { name: MEMINI_CONSOLIDATE_MODE, value: async }
            - { name: MEMINI_RERANK, value: "off" }
            - { name: MEMINI_SPLIT_DEDUP_LLM_MERGE, value: "false" }
            - { name: MEMINI_DEDUP_LLM_MERGE, value: "false" }
            - { name: MEMINI_API_KEY, valueFrom: { secretKeyRef: { name: memini-api-keys, key: operator-key } } }
            - { name: MEMINI_LLM_API_KEY, valueFrom: { secretKeyRef: { name: memini-minimax, key: api-key } } }
            - { name: MEMINI_EMBED_API_KEY, valueFrom: { secretKeyRef: { name: memini-minimax, key: embedding-api-key } } }
          ports: [{ name: api, containerPort: 8080 }, { name: ui, containerPort: 8081 }, { name: metrics, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /healthz, port: api }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: api }, periodSeconds: 30 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: api-keys, mountPath: /etc/memini, readOnly: true }
      volumes:
        - { name: api-keys, secret: { secretName: memini-api-keys, items: [{ key: api-keys.yaml, path: api-keys.yaml }] } }
  volumeClaimTemplates:
    - metadata: { name: data, labels: { backup.monosense.io/enabled: "true" } }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ceph-rbd-retain
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: memini, labels: { app.kubernetes.io/name: memini } }
spec:
  selector: { app.kubernetes.io/name: memini }
  ports:
    - { name: api, port: 8080, targetPort: api }
    - { name: ui, port: 3000, targetPort: ui }
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: memini }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: memini } }
  endpoints: [{ port: metrics, interval: 30s }]
