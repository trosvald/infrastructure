---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: memini-api-keys }
spec:
  refreshInterval: 15m
  refreshPolicy: Periodic
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: memini-api-keys
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        api-keys.yaml: |
          keys:
            - name: forgejo
              hash: {{ .forgejo_hash | quote }}
              home: forgejo
              default_namespace: forgejo
            - name: codex
              hash: {{ .codex_hash | quote }}
              home: codex
              default_namespace: codex
            - name: operator
              hash: {{ .operator_hash | quote }}
              admin: true
        operator-key: '{{ .operator_key }}'
  data:
    - { secretKey: forgejo_hash, remoteRef: { key: platform/kubernetes/ai/memini, property: forgejo_api_key_hash } }
    - { secretKey: codex_hash, remoteRef: { key: platform/kubernetes/ai/memini, property: codex_api_key_hash } }
    - { secretKey: operator_hash, remoteRef: { key: platform/kubernetes/ai/memini, property: operator_api_key_hash } }
    - { secretKey: operator_key, remoteRef: { key: platform/kubernetes/ai/memini, property: operator_api_key } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: memini-minimax }
spec:
  refreshInterval: 15m
  refreshPolicy: Periodic
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: memini-minimax, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - { secretKey: api-key, remoteRef: { key: platform/kubernetes/ai/litellm, property: memini_virtual_key } }
    - { secretKey: embedding-api-key, remoteRef: { key: platform/kubernetes/ai/llmkube, property: embedding_api_key } }
