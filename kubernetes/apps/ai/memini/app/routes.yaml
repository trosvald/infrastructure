---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: memini-api }
spec:
  parentRefs: [{ name: envoy-internal, namespace: networking, sectionName: https }]
  hostnames: [memini-api.internal]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
        - path: { type: PathPrefix, value: /mcp }
      backendRefs: [{ name: memini, port: 8080 }]
