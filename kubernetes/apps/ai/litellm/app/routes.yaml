---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: litellm-api }
spec:
  parentRefs: [{ name: envoy-internal, namespace: networking, sectionName: https }]
  hostnames: [litellm.internal]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /v1 } }]
      backendRefs: [{ name: litellm, port: 4000 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: litellm-admin }
spec:
  parentRefs: [{ name: envoy-internal, namespace: networking, sectionName: https }]
  hostnames: [litellm-admin.internal]
  rules:
    - backendRefs: [{ name: litellm, port: 4000 }]
