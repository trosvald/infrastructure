---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: litellm }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: litellm } }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: networking, k8s:io.kubernetes.serviceaccount.name: envoy-internal }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: ai, k8s:io.kubernetes.serviceaccount.name: memini }
      toPorts: [{ ports: [{ port: "4000", protocol: TCP }] }]
  egress:
    - toServices:
        - k8sService: { serviceName: postgres-rw, namespace: database }
      toPorts: [{ ports: [{ port: "5432", protocol: TCP }] }]
    - toServices:
        - k8sService: { serviceName: dragonfly, namespace: database }
      toPorts: [{ ports: [{ port: "6379", protocol: TCP }] }]
    - toServices:
        - k8sService: { serviceName: codex-adapter, namespace: ai }
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
    - toFQDNs: [{ matchName: api.minimax.chat }]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s:k8s-app: kube-dns }
      toPorts: [{ ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }] }]
