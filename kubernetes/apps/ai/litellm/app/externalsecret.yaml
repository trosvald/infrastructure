---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: litellm-runtime }
spec:
  refreshInterval: 15m
  refreshPolicy: Periodic
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: litellm-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        PROXY_MASTER_KEY: '{{ .master_key }}'
        UI_USERNAME: '{{ .ui_username }}'
        UI_PASSWORD: '{{ .ui_password }}'
        MINIMAX_API_KEY: '{{ .minimax_api_key }}'
        DATABASE_URL: 'postgresql://litellm_a:{{ .database_password }}@postgres-rw.database.svc.cluster.local:5432/litellm?sslmode=verify-full&sslrootcert=/etc/cnpg/ca.crt&sslcert=/etc/cnpg/tls.crt&sslkey=/etc/cnpg/tls.key'
        REDIS_PASSWORD: '{{ .dragonfly_password }}'
  data:
    - { secretKey: master_key, remoteRef: { key: platform/kubernetes/ai/litellm, property: breakglass_master_key } }
    - { secretKey: ui_username, remoteRef: { key: platform/kubernetes/ai/litellm, property: ui_username } }
    - { secretKey: ui_password, remoteRef: { key: platform/kubernetes/ai/litellm, property: ui_password } }
    - { secretKey: minimax_api_key, remoteRef: { key: platform/kubernetes/ai/litellm, property: minimax_api_key } }
    - { secretKey: database_password, remoteRef: { key: platform/kubernetes/database/cloudnative-pg, property: litellm_a_password } }
    - { secretKey: dragonfly_password, remoteRef: { key: platform/kubernetes/database/dragonfly, property: litellm_a_password } }
