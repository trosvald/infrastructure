---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: llmkube-controller }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: llmkube } }
  ingress:
    - fromEntities: [host, remote-node]
      toPorts: [{ ports: [{ port: "8081", protocol: TCP }, { port: "9443", protocol: TCP }] }]
  egress:
    - toEntities: [kube-apiserver]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s:k8s-app: kube-dns }
      toPorts: [{ ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: qwen3-embedding-client }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: memini } }
  egress:
    - toCIDR: [10.25.13.95/32]
      toPorts: [{ ports: [{ port: "8443", protocol: TCP }] }]
