---
apiVersion: v1
kind: Service
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    bgp.monosense.io/advertise: "true"
    lbipam.monosense.io/class: infrastructure
  annotations:
    lbipam.cilium.io/ips: 10.25.20.10
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    component: kube-apiserver
    tier: control-plane
  ports:
    - port: 1
      targetPort: 6443
