---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
    namespace: flux-system
  interval: 1h
  values:
    autoDirectNodeRoutes: true
    bandwidthManager:
      enabled: true
      bbr: true
    bpf:
      datapathMode: netkit
      mapDynamicSizeRatio: 0.0025
      masquerade: true
      preallocateMaps: false
    bpfClockProbe: true
    bgpControlPlane:
      enabled: true
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cluster:
      id: 1
      name: main
    cni:
      exclusive: true
    dashboards:
      enabled: false
    devices: bond0
    enableIPv4BIGTCP: false
    endpointRoutes:
      enabled: true
    encryption:
      enabled: true
      nodeEncryption: false
      type: wireguard
    envoy:
      enabled: false
    hubble:
      enabled: true
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop
          - flow
          - icmp
          - tcp
      relay:
        enabled: true
        service:
          type: ClusterIP
        tls:
          server:
            enabled: true
      ui:
        enabled: false
      tls:
        auto:
          enabled: true
          method: cronJob
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 10.244.0.0/16
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    loadBalancer:
      acceleration: best-effort
      algorithm: maglev
      mode: dsr
    loadBalancerIPAM:
      enabled: true
    localRedirectPolicies:
      enabled: false
    operator:
      dashboards:
        enabled: false
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: false
      replicas: 2
      rollOutPods: true
    mtu: 1496
    pmtuDiscovery:
      enabled: true
    policyAuditMode: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false
        trustCRDsExist: false
    hostFirewall:
      enabled: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
    socketLB:
      enabled: true
      hostNamespaceOnly: true
