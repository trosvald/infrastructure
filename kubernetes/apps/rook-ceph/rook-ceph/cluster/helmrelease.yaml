---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
    namespace: flux-system
  interval: 1h
  timeout: 15m
  values:
    cephClusterSpec:
      cleanupPolicy:
        confirmation: ""
        allowUninstallWithVolumes: false
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        ssl: false
      disruptionManagement:
        managePodBudgets: true
        osdMaintenanceTimeout: 30
      mgr:
        count: 2
        allowMultiplePerNode: false
        modules:
          - name: pg_autoscaler
            enabled: true
      mon:
        count: 3
        allowMultiplePerNode: false
      network:
        provider: host
        addressRanges:
          public:
            - 10.25.14.0/24
        connections:
          encryption:
            enabled: false
          compression:
            enabled: false
          requireMsgr2: true
      placement:
        mon:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - bsd-k8s-01
                        - bsd-k8s-02
                        - bsd-k8s-03
      resources:
        mgr:
          limits:
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        mon:
          limits:
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        osd:
          limits:
            memory: 6Gi
          requests:
            cpu: 500m
            memory: 4Gi
        prepareosd:
          requests:
            cpu: 250m
            memory: 50Mi
      storage:
        useAllDevices: false
        useAllNodes: false
        config:
          encryptedDevice: "false"
          osdsPerDevice: "1"
        nodes:
          - name: bsd-k8s-01
            devices:
              - name: /dev/disk/by-id/nvme-eui.6479a7726a304b94
          - name: bsd-k8s-02
            devices:
              - name: /dev/disk/by-id/nvme-eui.6479a77cda30650b
          - name: bsd-k8s-03
            devices:
              - name: /dev/disk/by-id/nvme-nvme.10ec-5450424632333132313230303330333031313738-5445414d20544d3846503630303154-00000001
          - name: bsd-k8s-04
            devices:
              - name: /dev/disk/by-id/nvme-eui.6479a7726a304bbf
          - name: bsd-k8s-05
            devices:
              - name: /dev/disk/by-id/nvme-nvme.10ec-5450424632333132313230303330333031353935-5445414d20544d3846503630303154-00000001
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: false
    cephBlockPools:
      - name: ceph-rbd
        spec:
          failureDomain: host
          replicated:
            size: 3
            requireSafeReplicaSize: true
          parameters:
            min_size: "2"
        storageClass:
          enabled: true
          name: ceph-rbd-delete
          allowVolumeExpansion: true
          isDefault: true
          mountOptions:
            - discard
          parameters:
            csi.storage.k8s.io/fstype: ext4
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            imageFeatures: deep-flatten,exclusive-lock,fast-diff,layering,object-map
            imageFormat: "2"
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: ceph-rbd-delete
      isDefault: true
      deletionPolicy: Delete
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
              requireSafeReplicaSize: true
            parameters:
              min_size: "2"
          dataPools:
            - name: data0
              failureDomain: host
              replicated:
                size: 3
                requireSafeReplicaSize: true
              parameters:
                min_size: "2"
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 1Gi
        storageClass:
          enabled: true
          name: ceph-filesystem-delete
          pool: data0
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: ceph-filesystem-delete
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores: []
