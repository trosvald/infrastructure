---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oauth2-proxy
  namespace: security
spec:
  interval: 1h
  path: ./kubernetes/apps/security/oauth2-proxy/app
  prune: true
  suspend: true
  sourceRef: { kind: GitRepository, name: flux-system, namespace: flux-system }
  wait: true
  timeout: 15m
  dependsOn:
    - { name: keycloak, namespace: security }
    - { name: rook-ceph-cluster, namespace: rook-ceph }
    - { name: victoria-metrics-k8s-stack, namespace: observability }
    - { name: victoria-logs, namespace: observability }
    - { name: memini, namespace: ai }
