---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: ceph-dashboard }
spec:
  parentRefs: [{ name: envoy-internal, namespace: networking, sectionName: https }]
  hostnames: [ceph.monosense.io]
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Authorization, X-Forwarded-User, X-Forwarded-Email, X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Groups]
      backendRefs: [{ name: oauth2-proxy-ceph, port: 80 }]
