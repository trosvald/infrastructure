---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: oauth2-proxy-ceph }
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: oauth2-proxy-ceph
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - { secretKey: client-id, remoteRef: { key: platform/kubernetes/security/keycloak, property: ceph_client_id } }
    - { secretKey: client-secret, remoteRef: { key: platform/kubernetes/security/keycloak, property: ceph_client_secret } }
    - { secretKey: cookie-secret, remoteRef: { key: platform/kubernetes/security/keycloak, property: ceph_cookie_secret } }
