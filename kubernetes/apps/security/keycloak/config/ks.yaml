---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak
  namespace: security
spec:
  interval: 1h
  path: ./kubernetes/apps/security/keycloak/cluster
  prune: false
  suspend: true
  sourceRef: { kind: GitRepository, name: flux-system, namespace: flux-system }
  wait: true
  timeout: 20m
  dependsOn:
    - { name: keycloak-operator, namespace: security }
    - { name: postgres, namespace: database }
    - { name: dragonfly, namespace: database }
    - { name: external-secrets-config, namespace: external-secrets }
  healthCheckExprs:
    - apiVersion: k8s.keycloak.org/v2beta1
      kind: Keycloak
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'true')
      failed: status.conditions.exists(c, c.type == 'Ready' && c.status == 'false')
