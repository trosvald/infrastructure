---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: victoria-metrics

    victoria-metrics-operator:
      crds:
        plain: true
      operator:
        disable_prometheus_converter: false
        enable_converter_ownership: true

    defaultDashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana

    external:
      grafana:
        host: https://grafana.monosense.io
        datasource: prometheus

    grafana:
      enabled: false

    vmsingle:
      spec:
        retentionPeriod: 14d
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 4Gi
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: ceph-block
          resources:
            requests:
              storage: 50Gi
      route:
        enabled: true
        hostnames:
          - prometheus.monosense.io
        parentRefs:
          - name: envoy-internal
            namespace: networking

    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: blackhole
        receivers:
          - name: blackhole
      spec:
        externalURL: https://alertmanager.monosense.io
        disableNamespaceMatcher: true
        selectAllByDefault: true
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
      route:
        enabled: true
        hostnames:
          - alertmanager.monosense.io
        parentRefs:
          - name: envoy-internal
            namespace: networking

    vmalert:
      spec:
        selectAllByDefault: true

    vmagent:
      spec:
        selectAllByDefault: true
        scrapeInterval: 20s

    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes

    kubeProxy:
      enabled: false
