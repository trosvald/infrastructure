---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
    namespace: flux-system
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: victoria-metrics

    victoria-metrics-operator:
      crds:
        plain: true
      operator:
        disable_prometheus_converter: false
        enable_converter_ownership: true

    defaultDashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana

    external:
      grafana:
        host: https://grafana.monosense.io
        datasource: prometheus

    grafana:
      enabled: false

    vmsingle:
      spec:
        retentionPeriod: 14d
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { cpu: "2", memory: 4Gi }
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: ceph-block
          resources:
            requests:
              storage: 50Gi
      route:
        enabled: false

    alertmanager:
      config: {}
      spec:
        configSecret: alertmanager-config
        externalURL: https://alertmanager.monosense.io
        disableNamespaceMatcher: true
        selectAllByDefault: true
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
      route:
        enabled: false

    vmalert:
      spec:
        selectAllByDefault: true
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }

    vmagent:
      spec:
        selectAllByDefault: true
        scrapeInterval: 20s
        statefulMode: true
        statefulStorage:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              storageClassName: ceph-block
              resources:
                requests: { storage: 10Gi }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 1Gi }

    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes

    kubeProxy:
      enabled: false
