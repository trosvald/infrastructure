---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  chartRef:
    kind: OCIRepository
    name: fluent-bit
    namespace: flux-system
  interval: 1h
  values:
    kind: DaemonSet
    fullnameOverride: fluent-bit

    testFramework:
      enabled: false

    serviceMonitor:
      enabled: true
      interval: 30s

    prometheusRule:
      enabled: true
      rules:
        - alert: FluentBitNoOutputBytesProcessed
          expr: rate(fluentbit_output_proc_bytes_total[5m]) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Fluent Bit is not sending logs
            description: >-
              Fluent Bit instance {{ $labels.instance }} output {{ $labels.name }}
              has not processed bytes for at least 15 minutes.

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

    tolerations:
      - operator: Exists

    priorityClassName: system-node-critical
    terminationGracePeriodSeconds: 30

    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true

    updateStrategy:
      type: RollingUpdate

    luaScripts:
      sanitize.lua: |
        local function insensitive(value)
          return (value:gsub("%a", function(character)
            return "[" .. character:lower() .. character:upper() .. "]"
          end))
        end

        function sanitize(tag, timestamp, record)
          local kubernetes = record["kubernetes"] or {}
          local labels = kubernetes["labels"] or {}
          local message = tostring(record["log"] or record["message"] or "")
          for _, field in ipairs({"authorization", "cookie", "token", "password", "secret"}) do
            message = message:gsub(
              insensitive(field) .. "%s*[=:]%s*[^%s,;]+",
              field .. "=[REDACTED]"
            )
          end
          local clean = {
            message = message,
            stream = record["stream"],
            kubernetes = {
              namespace_name = kubernetes["namespace_name"],
              pod_name = kubernetes["pod_name"],
              container_name = kubernetes["container_name"],
              labels = {
                app = labels["app"],
                app_name = labels["app.kubernetes.io/name"],
                app_instance = labels["app.kubernetes.io/instance"]
              }
            }
          }
          return 2, timestamp, clean
        end

    config:
      service: |
        [SERVICE]
            Daemon Off
            Flush {{ .Values.flush }}
            Log_Level {{ .Values.logLevel }}
            Parsers_File /fluent-bit/etc/parsers.conf
            Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port {{ .Values.metricsPort }}
            Health_Check On
            storage.path /var/lib/fluent-bit/storage
            storage.sync normal
            storage.checksum off
            storage.backlog.mem_limit 10M

      inputs: |
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser cri, docker
            Tag kube.*
            DB /var/lib/fluent-bit/tail-containers.db
            DB.Sync Normal
            Mem_Buf_Limit 20MB
            Skip_Long_Lines On
            Refresh_Interval 10
            Rotate_Wait 30
            storage.type filesystem

      filters: |
        [FILTER]
            Name kubernetes
            Match kube.*
            Kube_URL https://kubernetes.default.svc:443
            Kube_CA_File /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            Kube_Token_File /var/run/secrets/kubernetes.io/serviceaccount/token
            Kube_Tag_Prefix kube.var.log.containers.
            Merge_Log On
            Keep_Log Off
            Labels On
            Annotations Off

        [FILTER]
            Name lua
            Match kube.*
            script /fluent-bit/scripts/sanitize.lua
            call sanitize

      outputs: |
        [OUTPUT]
            Name http
            Match kube.*
            Host victoria-logs.observability.svc.cluster.local
            Port 9428
            URI /insert/jsonline?_stream_fields=kubernetes.namespace_name,kubernetes.pod_name,kubernetes.container_name,kubernetes.labels.app_name,kubernetes.labels.app_instance&_msg_field=message&_time_field=time&decolorize_fields=message
            Format json_lines
            Json_Date_Key time
            Json_Date_Format iso8601
            Compress gzip
            Retry_Limit False

    daemonSetVolumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: fluent-bit-state
        hostPath:
          path: /var/lib/fluent-bit
          type: DirectoryOrCreate

    daemonSetVolumeMounts:
      - name: varlog
        mountPath: /var/log
        readOnly: true
      - name: fluent-bit-state
        mountPath: /var/lib/fluent-bit
