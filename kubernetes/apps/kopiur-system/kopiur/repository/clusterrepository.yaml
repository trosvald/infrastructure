---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: librefs
spec:
  allowedNamespaces:
    selector:
      matchLabels:
        kopiur.home-operations.com/backup: "true"
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-librefs-secret
          namespace: kopiur-system
      bucket: kubernetes-backups
      endpoint: s3.monosense.io:443
      prefix: primary
      region: us-east-1
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-librefs-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  moverDefaults:
    cache:
      capacity: 1Gi
      mode: Ephemeral
      storageClassName: local-hostpath-delete
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    scratch:
      capacity: 1Gi
      storageClassName: local-hostpath-delete
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    ttlSecondsAfterFinished: 300
  scheduleDefaults:
    timezone: Asia/Jakarta
